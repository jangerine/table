<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>머핀타임 (Muffin Time) - Web Edition</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html,body{margin:0;height:100%;background:#0f172a;font-family:'Pretendard',sans-serif;color:#e2e8f0;overflow:hidden;touch-action:manipulation;}
  #app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;}

  /* ---------- 로비 화면 ---------- */
  #lobby{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:500;background:radial-gradient(circle at 50% 20%,#1e293b,#0f172a);}
  #lobby h1{font-size:30px;margin:0 0 4px;background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #lobby .sub{color:#94a3b8;font-size:12px;margin-bottom:10px;text-align:center;}
  .lobby-card{background:rgba(30,41,59,.9);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;}
  .lobby-card label{font-size:11px;color:#94a3b8;}
  .lobby-card input{padding:10px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px;text-align:center;text-transform:uppercase;}
  .big-btn{padding:13px;border:none;border-radius:12px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .big-btn:active{transform:scale(.97);}
  .btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);}
  .btn-teal{background:linear-gradient(135deg,#14b8a6,#0d9488);}
  .btn-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);}
  .btn-red{background:linear-gradient(135deg,#ef4444,#b91c1c);}
  .btn-gray{background:linear-gradient(135deg,#64748b,#334155);}
  #myRoomIdBox{font-size:26px;font-weight:900;letter-spacing:4px;color:#60a5fa;text-align:center;padding:8px;}
  #lobbyPlayers{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px;}
  .lobby-player-row{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.05);border-radius:8px;font-size:13px;}

  /* ---------- 게임 화면 ---------- */
  #game{position:absolute;inset:0;display:none;flex-direction:column;}
  #topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;z-index:20;}
  #topbar .info{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pill{background:rgba(255,255,255,.08);padding:4px 9px;border-radius:20px;font-weight:700;}
  .pill.turn{background:linear-gradient(135deg,#10b981,#059669);}
  #playersStrip{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:rgba(255,255,255,.03);}
  .player-chip{flex:0 0 auto;background:#1e293b;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 9px;font-size:10px;min-width:74px;text-align:center;}
  .player-chip.me{border-color:#60a5fa;}
  .player-chip.current{outline:2px solid #10b981;}
  .player-chip .nm{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player-chip .stat{color:#94a3b8;margin-top:2px;}

  #logPanel{flex:1;overflow-y:auto;padding:8px 10px;font-size:11px;line-height:1.6;color:#cbd5e1;}
  #logPanel div{margin-bottom:2px;}
  #logPanel .sys{color:#f59e0b;}
  #logPanel .win{color:#34d399;font-weight:800;}

  #centerZone{display:flex;justify-content:center;gap:16px;padding:6px;font-size:11px;color:#94a3b8;}
  #centerZone .zone-box{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 12px;text-align:center;}
  #centerZone .zone-box b{display:block;font-size:16px;color:#fff;}

  #trapRow{display:flex;gap:6px;padding:4px 10px;overflow-x:auto;}
  .trap-slot{flex:0 0 auto;width:46px;height:64px;border-radius:6px;background:linear-gradient(135deg,#7f1d1d,#450a0a);border:2px solid #ef4444;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;color:#fecaca;cursor:pointer;}
  .trap-slot.empty{background:rgba(255,255,255,.03);border:2px dashed rgba(255,255,255,.15);}

  #handWrap{background:rgba(15,23,42,.95);border-top:1px solid rgba(255,255,255,.1);padding:8px 8px 10px;z-index:20;}
  #handActions{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
  #hand{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;}
  .card{flex:0 0 auto;width:88px;height:124px;border-radius:10px;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;line-height:1.3;box-shadow:0 4px 10px rgba(0,0,0,.4);cursor:pointer;border:2px solid rgba(255,255,255,.15);}
  .card.selected{outline:3px solid #fbbf24;transform:translateY(-6px);}
  .card .cname{font-weight:900;font-size:11px;}
  .card .cen{font-size:8px;opacity:.7;}
  .card .cdesc{font-size:8.5px;opacity:.92;}
  .card.trap{background:linear-gradient(160deg,#7f1d1d,#450a0a);color:#fee2e2;}
  .card.action{background:linear-gradient(160deg,#075985,#0c4a6e);color:#e0f2fe;}
  .card.counter{background:linear-gradient(160deg,#14532d,#052e14);color:#dcfce7;}
  .card.minigame{background:linear-gradient(160deg,#6b21a8,#3b0764);color:#f3e8ff;}
  .card .tag{font-size:7.5px;opacity:.65;text-transform:uppercase;}

  /* ---------- 모달 ---------- */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:16px;}
  .modal{background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .modal h3{margin:0 0 10px;font-size:15px;}
  .modal .desc{font-size:12px;color:#94a3b8;margin-bottom:12px;}
  .choice-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .choice-btn{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;text-align:left;font-size:12px;cursor:pointer;}
  .choice-btn.picked{background:#f59e0b;color:#000;font-weight:800;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}
  .modal-actions button{padding:9px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;}
  #timerBar{height:4px;background:#334155;border-radius:2px;overflow:hidden;margin-bottom:10px;}
  #timerBar div{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);width:100%;transition:width linear;}

  #toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,.96);border:1px solid rgba(255,255,255,.15);padding:10px 16px;border-radius:10px;font-size:12px;z-index:400;display:none;max-width:88%;text-align:center;}
  #winOverlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:600;}
  #winOverlay h1{font-size:34px;background:linear-gradient(90deg,#fbbf24,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 로비 ============ -->
  <div id="lobby">
    <h1>🧁 머핀타임</h1>
    <div class="sub">asdfmovie 원작 카드 파티게임 · 손패가 정확히 10장이 되면 승리!</div>

    <div class="lobby-card">
      <label>내 닉네임</label>
      <input id="nickInput" maxlength="8" placeholder="닉네임 입력">
    </div>

    <div class="lobby-card" id="hostCard">
      <label>방 만들기 (호스트가 되어 게임을 관리합니다)</label>
      <button class="big-btn btn-amber" id="createRoomBtn">🏠 방 만들기</button>
      <div id="myRoomIdBox" style="display:none;"></div>
    </div>

    <div class="lobby-card">
      <label>방 참가하기</label>
      <input id="joinIdInput" maxlength="4" placeholder="4자리 코드">
      <button class="big-btn btn-teal" id="joinRoomBtn">🚪 참가하기</button>
    </div>

    <div id="lobbyPlayers"></div>
    <button class="big-btn btn-purple" id="startGameBtn" style="display:none;max-width:340px;width:100%;">🎮 게임 시작</button>
    <div class="sub" id="lobbyStatus"></div>
  </div>

  <!-- ============ 게임 화면 ============ -->
  <div id="game">
    <div id="topbar">
      <div class="info">
        <span class="pill">🎴 덱 <span id="deckCount">0</span></span>
        <span class="pill">🗑️ <span id="discardTop">-</span></span>
        <span class="pill">🏆 목표 <span id="winThresholdView">10</span>장</span>
      </div>
      <div class="pill turn" id="turnIndicator">대기중</div>
    </div>
    <div id="playersStrip"></div>
    <div id="centerZone">
      <div class="zone-box">내 손패<b id="myHandCount">0</b></div>
      <div class="zone-box">설치한 함정<b id="myTrapCount">0</b>/3</div>
    </div>
    <div id="trapRow"></div>
    <div id="logPanel"></div>

    <div id="handWrap">
      <div id="handActions"></div>
      <div id="hand"></div>
    </div>
  </div>

  <!-- 카운터 응답 토스트 -->
  <div id="toast"></div>

  <!-- 범용 모달 (선택/디스카드/카운터/미니게임 등) -->
  <div class="overlay" id="modalOverlay">
    <div class="modal" id="modalBox"></div>
  </div>

  <div id="winOverlay">
    <h1 id="winText">🎉 승리! 🎉</h1>
    <button class="big-btn btn-gray" onclick="location.reload()">새 게임</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
/* =========================================================================
   머핀타임 WEB EDITION
   ------------------------------------------------------------------------
   구조:
   1) CARD_DB            : 카드 데이터 (트랩/액션/카운터/미니게임)
   2) EffectEngine        : 카드 효과를 해석/적용하는 호스트 전용 엔진
   3) Net                 : PeerJS 기반 호스트-권위형(Star topology) 네트워크
   4) GameHost            : 호스트에서만 도는 게임 상태 머신 (권위 데이터)
   5) UI                  : 렌더링 + 사용자 입력 (모든 클라이언트 공통)
   ========================================================================= */
(function(){
'use strict';

/* =========================================================================
   1) CARD DATABASE
   ========================================================================= */
const CARD_DB = [
/* ---------------- 함정 카드 (trap, 빨강) ---------------- */
{id:'t_robbery',name:'강도다!',en:'A ROBBERY',type:'trap',n:3,desc:'상대에게 전화를 걸었다고 우깁니다. 걸려든 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3}},
{id:'t_dontthink',name:'고양이를 생각하지 마',en:"DON'T THINK ABOUT CATS",type:'trap',desc:'누군가 고양이 얘기를 꺼냈다면 그 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3}},
{id:'t_jump',name:'깜짝 놀랐지!',en:'MADE YA JUMP',type:'trap',desc:'누군가를 놀래키는 데 성공했다면 그 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3}},
{id:'t_dontbeatme',name:'난 쓰러지지 않는다',en:"DON'T BEAT ME",type:'trap',desc:'내 손패가 0장일 때만 발동 가능. 지목한 상대의 손패 전부를 가져옵니다.',trigger:'self',condition:'handEmpty',fx:{k:'stealAll',from:'target',to:'self'}},
{id:'t_named',name:'너의 이름은',en:'NAMED THIS WAY',type:'trap',desc:'누군가 내 이름을 불렀다면 그 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3}},
{id:'t_face',name:'네 얼굴 위에',en:'ON YOUR FACE',type:'trap',desc:'들키지 않고 버텼다면, 지목한 사람을 포함해 나를 제외한 모두가 카드 3장씩 버립니다.',fx:{k:'discard',who:'others',n:3}},
{id:'t_happy',name:'네가 행복하다면',en:"IF YOU'RE HAPPY",type:'trap',desc:'누군가 큰소리로 노래를 불렀다면 그 사람에게서 카드 3장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:3}},
{id:'t_whoate',name:'누가 먹었어?',en:'WHO ATE THIS?',type:'trap',desc:'누군가 뭔가를 먹었다면 그 사람에게서 카드 3장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:3}},
{id:'t_magicword',name:'마법의 단어',en:'MAGIC WORD',type:'trap',desc:'누군가 "~해줘"라고 부탁했다면 그 사람에게서 카드 3장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:3}},
{id:'t_donttouch',name:'만지지 마',en:"DON'T TOUCH",type:'trap',desc:'누군가 이 카드를 건드렸다고 지목당하면 카드 5장을 버립니다.',fx:{k:'discard',who:'target',n:5}},
{id:'t_youfool',name:'멍청하군',en:'YOU FOOL',type:'trap',desc:'누군가 카드를 버리는 걸 목격했다면 그 사람에게서 카드 1장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:1}},
{id:'t_hello',name:'모두들 안녕',en:'HELLO THERE',type:'trap',desc:'내가 인사했는데 화답한 사람이 있다면 그 사람에게서 카드 3장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:3}},
{id:'t_what',name:'뭐어라고?!',en:'WHAT?!',type:'trap',desc:'누군가 "뭐라고?"라고 말하게 만들었다면 그 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3}},
{id:'t_upsidedown',name:'반대로',en:'UPSIDE DOWN',type:'trap',desc:'카드 효과를 착각한 사람이 있다면 그 사람에게서 카드 2장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:2}},
{id:'t_fart',name:'방귀 뿡뿡 엉덩이',en:'FARTING BUTT',type:'trap',desc:'누군가 방귀/트림/기침/재채기를 했다면 그 사람에게서 카드 3장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:3}},
{id:'t_sarcasm',name:'비꼬기 대장',en:'BEST SARCASM',type:'trap',desc:'누군가 비꼬는 말을 했다면 그 사람에게서 카드 3장을 빼앗습니다.',fx:{k:'steal',from:'target',to:'self',n:3}},
{id:'t_lol',name:'빵 터졌네',en:'LOL OUT LOUD',type:'trap',desc:'누군가 "머핀 타임!"을 외쳤다면 그 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3},hookOn:'declareMuffinTime'},
{id:'t_countdown',name:'카운트다운',en:'COUNTDOWN',type:'trap',desc:'누군가 내 카드가 몇 장이냐고 물었다면 그 사람은 카드 3장을 버립니다.',fx:{k:'discard',who:'target',n:3}},
{id:'t_tired',name:'피곤하니?',en:'TIRED?',type:'trap',desc:'누군가 하품을 했다면 그 사람은 카드 4장을 버립니다.',fx:{k:'discard',who:'target',n:4}},
{id:'t_highfive',name:'하이파이브',en:'HIGH FIVE',type:'trap',desc:'나와 하이파이브를 한 사람은 카드 5장을 버립니다.',fx:{k:'discard',who:'target',n:5}},
{id:'t_cardsick',name:'카드 울렁증',en:'CARD SICK',type:'trap',desc:'내 손패가 10장을 초과하는 즉시, 10장이 될 때까지 자동으로 버립니다. (설치 시 항상 감시)',trigger:'passive',custom:'cardSick'},
{id:'t_whattwist',name:'오히려 좋아',en:'WHAT A TWIST',type:'trap',desc:'내 손패가 0장이라면 즉시 카드 10장을 뽑을 수 있습니다.',trigger:'self',condition:'handEmpty',fx:{k:'draw',who:'self',n:10}},

/* ---------------- 행동 카드 (action, 하늘색) ---------------- */
{id:'a_end',name:'-끝-',en:'THE END',type:'action',desc:'내 다음 차례가 시작될 때, 그 시점 손패가 가장 적은 사람이 즉시 승리합니다. (동률이면 계속 진행)',fx:{k:'setWinRuleAt',rule:'fewest'}},
{id:'a_oneyear',name:'1년 남으셨습니다',en:'ONE YEAR TO LIVE',type:'action',desc:'내 다음 차례가 시작될 때, 그 시점 손패가 가장 많은 사람이 즉시 승리합니다. (동률이면 계속 진행)',fx:{k:'setWinRuleAt',rule:'most'}},
{id:'a_pineapple',name:'갑자기 분위기 파인애플',en:'SUDDENLY PINEAPPLES',type:'action',desc:'설치된 모든 함정 카드를 버립니다.',fx:{k:'removeTraps',who:'all'}},
{id:'a_bigbaby',name:'거대 아기',en:'BIG BABY',type:'action',desc:'무작위로 정해진 한 명이 카드 3장을 버립니다.',fx:{k:'discard',who:'randomOther',n:3}},
{id:'a_bee',name:'거대함',en:'BIG BEE',type:'action',desc:'손패가 가장 많은 사람을 제외한 모두가 그 사람에게서 카드 1장씩 빼앗습니다.',fx:{k:'custom',id:'bigBee'}},
{id:'a_gunman',name:'건맨',en:'GUNMAN',type:'action',desc:'무작위로 정해진 한 명이 손에 든 카드를 전부 버립니다.',fx:{k:'discard',who:'randomOther',n:'all'}},
{id:'a_bear',name:'곰 찾았다',en:'DRAW A BEAR',type:'action',desc:'카드를 3장 뽑습니다.',fx:{k:'draw',who:'self',n:3}},
{id:'a_fallingup',name:'굴러 올라가기',en:'FALLING UP',type:'action',desc:'게임 진행 방향을 반대로 바꿉니다.',needsTarget:false,fx:{k:'reverse'}},
{id:'a_dontwantfat',name:'그만 먹을래',en:"DON'T WANT TO BE FAT",type:'action',desc:'아무나 한 명을 지목해 카드 5장을 버리게 합니다.',needsTarget:true,fx:{k:'discard',who:'target',n:5}},
{id:'a_wait',name:'기다려야지',en:'YOU CAN WAIT',type:'action',desc:'상대를 지목해 다음 차례를 쉬게 합니다.',needsTarget:true,fx:{k:'skip',who:'target'}},

{id:'c_deadtome',name:'죽은거나 다름없어',en:'DEAD TO ME',type:'counter',desc:'방금 나온 효과를 취소하고, 카드를 낸 사람은 다음 차례를 쉽니다.',fx:{k:'counterCancel'},then:{k:'skip',who:'sourceOfEvent'}},
{id:'c_catchknife',name:'칼 날아 간다',en:'CATCH THE KNIFE',type:'counter',desc:'방금 나온 카운터 카드를 취소합니다.',fx:{k:'counterCancel'}},
];
const CARD_MAP = {}; CARD_DB.forEach(c=>CARD_MAP[c.id]=c);
const TRAP_IDS = CARD_DB.filter(c=>c.type==='trap').map(c=>c.id);
const NONTRAP_IDS = CARD_DB.filter(c=>c.type!=='trap').map(c=>c.id);

/* =========================================================================
   2) UTIL
   ========================================================================= */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(){
  // 카드 등장 빈도를 살짝 다르게 하여 실제 덱 구성 느낌을 냄
  let deck=[];
  CARD_DB.forEach(c=>{
    let copies = c.type==='trap' ? 2 : (c.type==='counter' ? 2 : (c.type==='minigame'?1:2));
    for(let i=0;i<copies;i++) deck.push(c.id);
  });
  return shuffle(deck);
}
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function cardNeedsTarget(card){
  if(typeof card.needsTarget==='boolean') return card.needsTarget;
  const fx=card.fx||{};
  return fx.who==='target'||fx.from==='target'||fx.to==='target';
}
function cardNeedsTarget2(card){
  if(typeof card.needsTarget2==='boolean') return card.needsTarget2;
  const fx=card.fx||{};
  return fx.from==='target2'||fx.to==='target2';
}
function typeLabel(t){ return t==='trap'?'TRAP':t==='action'?'ACTION':t==='counter'?'COUNTER':'MINI'; }

/* =========================================================================
   3) 전역 가변 상태
   ========================================================================= */
let peer=null, myId=null, isHost=false, hostConn=null, guestConns={}, myName='';
let lobbyPlayers=[];
let state=null;          // 호스트에서만 채워지는 권위 상태
let myView=null;         // 모든 클라이언트가 렌더링에 사용하는 개인화된 뷰
let selectedCardForPlay=null;
let lastHandledPromptId=null, lastHandledMultiId=null, lastCounterEventKey=null;

/* =========================================================================
   4) 호스트 전용 게임 엔진
   ========================================================================= */
function findPlayer(pid){ return state.players.find(p=>p.id===pid); }
function otherPlayers(pid){ return state.players.filter(p=>p.id!==pid); }
function nextIndex(idx,dir,len){ return (idx+dir+len)%len; }
function nameOf(pid){ const p=findPlayer(pid); return p?p.name:'???'; }
function addLog(text){ state.log.push(text); if(state.log.length>80) state.log.shift(); }
function minHand(){ const m=Math.min(...state.players.map(p=>p.hand.length)); return state.players.filter(p=>p.hand.length===m); }
function maxHand(){ const m=Math.max(...state.players.map(p=>p.hand.length)); return state.players.filter(p=>p.hand.length===m); }
function markSkip(pid){ if(!pid) return; state.skipSet=state.skipSet||{}; state.skipSet[pid]=true; }
function resolveWho(w,ev){
  if(w==='self') return ev.sourceId;
  if(w==='target') return ev.targetId;
  if(w==='target2') return ev.targetId2;
  if(w==='sourceOfEvent') return ev.sourceId;
  return w;
}

function reshuffleDiscardIntoDeck(){
  if(state.discard.length===0) return;
  state.deck = shuffle(state.discard); state.discard=[];
  addLog('🔄 카드 더미가 비어 버린 카드 더미를 섞어 다시 채웠습니다.');
}
function drawCards(pid,n,opts){
  opts=opts||{};
  const p=findPlayer(pid); if(!p||!n) return;
  for(let i=0;i<n;i++){
    if(state.deck.length===0) reshuffleDiscardIntoDeck();
    if(state.deck.length===0) break;
    const c = opts.fromBottom ? state.deck.shift() : state.deck.pop();
    p.hand.push(c);
    if(opts.reveal) addLog('👀 '+nameOf(pid)+'님이 ['+CARD_MAP[c].name+']를 공개하며 뽑았습니다.');
  }
  if(!opts.reveal) addLog(nameOf(pid)+'님이 카드 '+n+'장을 뽑았습니다.');
  checkCardSick(pid);
}
function doSteal(from,to,n){
  if(!from||!to||from===to) return;
  const pf=findPlayer(from), pt=findPlayer(to); if(!pf||!pt) return;
  const count = n==='all' ? pf.hand.length : Math.min(n,pf.hand.length);
  if(count<=0) return;
  const taken = shuffle(pf.hand).slice(0,count);
  taken.forEach(c=>{ const i=pf.hand.indexOf(c); pf.hand.splice(i,1); pt.hand.push(c); });
  addLog(nameOf(to)+'님이 '+nameOf(from)+'님에게서 카드 '+count+'장을 빼앗았습니다.');
  checkCardSick(to);
}
function checkCardSick(pid){
  const p=findPlayer(pid); if(!p) return;
  if(p.traps.includes('t_cardsick') && p.hand.length>state.winThreshold){
    const excess=p.hand.length-state.winThreshold;
    const drop=shuffle(p.hand).slice(0,excess);
    drop.forEach(c=>{ const i=p.hand.indexOf(c); p.hand.splice(i,1); state.discard.push(c); });
    addLog('🩹 [카드 울렁증] 함정이 자동 발동해 '+nameOf(pid)+'님이 카드 '+excess+'장을 버렸습니다.');
  }
}

/* ---- 턴 진행 ---- */
function startTurn(){
  const pid=state.currentId;
  if(state.ruleFlags.lockActionsUntil===pid) state.ruleFlags.lockActionsUntil=null;
  if(state.ruleFlags.lockWinUntil===pid) state.ruleFlags.lockWinUntil=null;
  if(state.ruleFlags.winRuleAt && state.ruleFlags.winRuleAt.who===pid){
    const rule=state.ruleFlags.winRuleAt.rule; state.ruleFlags.winRuleAt=null;
    if(rule==='fewest'){ const m=minHand(); if(m.length===1){ endGame(m[0].id); return; } addLog('동률이라 [-끝-] 효과가 무산되었습니다.'); }
    else if(rule==='most'){ const m=maxHand(); if(m.length===1){ endGame(m[0].id); return; } addLog('동률이라 [1년 남으셨습니다] 효과가 무산되었습니다.'); }
    else if(rule==='anyLeft'){ const p=findPlayer(pid); if(p.hand.length>0){ endGame(pid); return; } }
  }
  const p=findPlayer(pid);
  if(!state.ruleFlags.lockWinUntil && p.hand.length===state.winThreshold){ endGame(pid); return; }
  state.phase='trap';
  broadcastAll();
}
function advanceTurn(){
  if(state.forceNextTurnTo){ state.turnIndex=state.order.indexOf(state.forceNextTurnTo); state.forceNextTurnTo=null; }
  else state.turnIndex = nextIndex(state.turnIndex, state.direction, state.order.length);
  let guard=0;
  while(state.skipSet && state.skipSet[state.order[state.turnIndex]] && guard<30){
    addLog(nameOf(state.order[state.turnIndex])+'님은 이번 차례를 쉽니다.');
    delete state.skipSet[state.order[state.turnIndex]];
    state.turnIndex = nextIndex(state.turnIndex, state.direction, state.order.length);
    guard++;
  }
  state.currentId = state.order[state.turnIndex];
  startTurn();
}
function finishMainAction(){
  if(state.forceNextTurnTo){ advanceTurn(); return; }
  if(state.ruleFlags.extraActionsFor===state.currentId && state.ruleFlags.extraActionsCount>0){
    state.ruleFlags.extraActionsCount--;
    if(state.ruleFlags.extraActionsCount<=0) state.ruleFlags.extraActionsFor=null;
    state.phase='main';
    broadcastAll();
  } else advanceTurn();
}
function endGame(winnerId){ state.phase='gameover'; state.winnerId=winnerId; addLog('🏆 '+nameOf(winnerId)+'님 승리!'); broadcastAll(); }

/* ---- 프롬프트 큐 (한 명씩 선택이 필요한 효과) ---- */
function enqueuePrompt(p){ state.promptQueue.push(p); }
function processPromptQueue(onDone){ state.onQueueDrained=onDone; pumpQueue(); }
function pumpQueue(){
  if(state.promptQueue.length===0){ const cb=state.onQueueDrained; state.onQueueDrained=null; if(cb) cb(); return; }
  const next=state.promptQueue.shift();
  const reqId=uid();
  state.pendingPrompt={id:reqId,forId:next.forId,type:next.type,payload:next.payload,deadline:Date.now()+16000};
  state.phase='promptWait';
  broadcastAll();
  state.promptTimer=setTimeout(()=>{ if(state.pendingPrompt&&state.pendingPrompt.id===reqId) autoResolvePrompt(); },16000);
}
function autoResolvePrompt(){
  const pp=state.pendingPrompt; if(!pp) return;
  let payload={};
  const p=findPlayer(pp.forId);
  if(pp.type==='chooseDiscard'){ let n=pp.payload.n; if(n==='all') n=p.hand.length; if(n==='allButOne') n=Math.max(0,p.hand.length-1); payload={cardIds:shuffle(p.hand).slice(0,Math.min(n,p.hand.length))}; }
  else if(pp.type==='chooseGive'){ payload={cardIds:shuffle(p.hand).slice(0,Math.min(pp.payload.n,p.hand.length))}; }
  else if(pp.type==='pickFromReveal'){ payload={cardId:pp.payload.options[0]}; }
  else if(pp.type==='pickTrapSlot'){ payload={slot:0}; }
  else if(pp.type==='selfJudge'){ payload={success:true}; }
  else if(pp.type==='selfJudgeWinner'){ payload={winnerId:null}; }
  else if(pp.type==='guessCount'){ payload={guess:-1}; }
  else if(pp.type==='stealOrDraw'){ payload={choice:'draw'}; }
  addLog('⏰ '+nameOf(pp.forId)+'님이 시간 초과로 자동 처리되었습니다.');
  applyPromptResult(pp,payload);
  state.pendingPrompt=null;
  pumpQueue();
}
function hostPromptResponse(pid,reqId,payload){
  if(!state.pendingPrompt||state.pendingPrompt.id!==reqId||state.pendingPrompt.forId!==pid) return;
  clearTimeout(state.promptTimer);
  applyPromptResult(state.pendingPrompt,payload);
  state.pendingPrompt=null;
  pumpQueue();
}
function applyPromptResult(pp,payload){
  const p=findPlayer(pp.forId);
  if(pp.type==='chooseDiscard'){
    (payload.cardIds||[]).forEach(cid=>{ const i=p.hand.indexOf(cid); if(i>=0){ p.hand.splice(i,1); state.discard.push(cid); } });
    addLog(nameOf(pp.forId)+'님이 카드 '+(payload.cardIds||[]).length+'장을 버렸습니다.');
  } else if(pp.type==='chooseGive'){
    const toP=findPlayer(pp.payload.toId);
    (payload.cardIds||[]).forEach(cid=>{ const i=p.hand.indexOf(cid); if(i>=0){ p.hand.splice(i,1); toP.hand.push(cid); } });
    addLog(nameOf(pp.forId)+'님이 '+nameOf(pp.payload.toId)+'님에게 카드 '+(payload.cardIds||[]).length+'장을 건넸습니다.');
    checkCardSick(pp.payload.toId);
  } else if(pp.type==='pickFromReveal'){
    const chosen=payload.cardId;
    if(chosen){ p.hand.push(chosen); addLog(nameOf(pp.forId)+'님이 ['+CARD_MAP[chosen].name+']를 가져갔습니다.'); }
    (pp.payload.options||[]).filter(c=>c!==chosen).forEach(c=>state.deck.push(c));
  } else if(pp.type==='pickTrapSlot'){
    const victim=findPlayer(pp.payload.victimId);
    const slot=Math.max(0,Math.min(payload.slot||0, victim.traps.length-1));
    if(victim.traps.length>0){ const taken=victim.traps.splice(slot,1)[0]; p.hand.push(taken); addLog(nameOf(pp.forId)+'님이 '+nameOf(pp.payload.victimId)+'님의 함정 카드를 가져갔습니다.'); }
  } else if(pp.type==='selfJudge'){
    if(payload.success===false){
      const ev=state.pendingEvent; const card=CARD_MAP[ev.cardId];
      applyBaseEffect(card.fx,ev,[]);
      addLog('❌ '+nameOf(ev.targetId)+'님이 실패해 카드를 빼앗겼습니다.');
    } else addLog('✅ 성공! 아무 일도 일어나지 않았습니다.');
  } else if(pp.type==='selfJudgeWinner'){
    if(payload.winnerId){ drawCards(payload.winnerId,pp.payload.n); addLog('🏅 '+nameOf(payload.winnerId)+'님이 승리해 카드 '+pp.payload.n+'장을 뽑았습니다.'); }
    else addLog('무승부로 처리되었습니다.');
  } else if(pp.type==='guessCount'){
    const victim=findPlayer(pp.payload.targetId);
    const actual=victim.hand.filter(c=>CARD_MAP[c].type==='action'||CARD_MAP[c].type==='minigame').length;
    if(Number(payload.guess)===actual){
      const taken=victim.hand.filter(c=>CARD_MAP[c].type==='action'||CARD_MAP[c].type==='minigame');
      taken.forEach(c=>{ const i=victim.hand.indexOf(c); victim.hand.splice(i,1); findPlayer(pp.forId).hand.push(c); });
      addLog('🎯 정답! '+nameOf(pp.forId)+'님이 '+nameOf(pp.payload.targetId)+'님의 행동 카드를 전부 가져갔습니다.');
      checkCardSick(pp.forId);
    } else addLog('❌ 오답이었습니다 (실제 '+actual+'장). 아무 일도 일어나지 않습니다.');
  } else if(pp.type==='stealOrDraw'){
    if(payload.choice==='steal') doSteal(pp.payload.targetId,pp.forId,pp.payload.n);
    else drawCards(pp.forId,pp.payload.n);
  }
}

/* ---- 다중 응답 프롬프트 (미니게임: 동시에 여러 명 응답 필요) ---- */
function enqueuePromptMulti(forIds,type,payload){
  const reqId=uid();
  state.pendingMultiPrompt={id:reqId,forIds:forIds.slice(),type,payload:payload||{},responses:{},deadline:Date.now()+14000};
  state.phase='minigame';
  broadcastAll();
  state.multiTimer=setTimeout(()=>{ if(state.pendingMultiPrompt&&state.pendingMultiPrompt.id===reqId) autoResolveMulti(); },14000);
}
function hostMultiResponse(pid,reqId,payload){
  const mp=state.pendingMultiPrompt; if(!mp||mp.id!==reqId||mp.forIds.indexOf(pid)<0) return;
  mp.responses[pid]=payload;
  if(Object.keys(mp.responses).length>=mp.forIds.length){ clearTimeout(state.multiTimer); finishMultiPrompt(); }
  else broadcastAll();
}
function autoDefaultFor(type){
  if(type==='rpsChoice') return {choice:['rock','paper','scissors'][Math.floor(Math.random()*3)]};
  if(type==='holdDuel') return {duration:Math.floor(Math.random()*1500)};
  if(type==='reactionRace') return {ts:9007199254740990};
  if(type==='secretVote') return {votedId:null};
  return {};
}
function autoResolveMulti(){
  const mp=state.pendingMultiPrompt; if(!mp) return;
  mp.forIds.forEach(id=>{ if(!(id in mp.responses)) mp.responses[id]=autoDefaultFor(mp.type); });
  finishMultiPrompt();
}
function rpsWinner(aId,aC,bId,bC){
  if(aC===bC) return null;
  const beats={rock:'scissors',scissors:'paper',paper:'rock'};
  return beats[aC]===bC ? aId : bId;
}
function finishMultiPrompt(){
  const mp=state.pendingMultiPrompt; state.pendingMultiPrompt=null;
  const ev=state.pendingEvent; const card=CARD_MAP[ev.cardId];
  if(mp.type==='rpsChoice'){
    const a=(mp.responses[ev.sourceId]||{}).choice, b=(mp.responses[ev.targetId]||{}).choice;
    const winner=rpsWinner(ev.sourceId,a,ev.targetId,b);
    if(winner){ drawCards(winner,card.n||3); addLog('✊✋✌️ '+nameOf(winner)+'님 승리! 카드 '+(card.n||3)+'장 획득'); }
    else addLog('✊✋✌️ 무승부!');
  } else if(mp.type==='holdDuel'){
    const da=(mp.responses[ev.sourceId]||{}).duration||0, db=(mp.responses[ev.targetId]||{}).duration||0;
    const winner = da===db?null:(da>db?ev.sourceId:ev.targetId);
    if(winner){ drawCards(winner,card.n||3); addLog('😤 숨참기 승자: '+nameOf(winner)+' → 카드 '+(card.n||3)+'장 획득'); }
    else addLog('😤 무승부!');
  } else if(mp.type==='reactionRace'){
    let lastId=null,lastTs=-1;
    mp.forIds.forEach(id=>{ const ts=(mp.responses[id]&&mp.responses[id].ts)||Infinity; if(ts>lastTs){ lastTs=ts; lastId=id; } });
    if(lastId){ addLog('🐌 가장 늦게 반응한 '+nameOf(lastId)+'님이 카드를 버립니다.'); enqueuePrompt({forId:lastId,type:'chooseDiscard',payload:{n:3}}); }
  } else if(mp.type==='secretVote'){
    const tally={};
    mp.forIds.forEach(id=>{ const v=mp.responses[id]&&mp.responses[id].votedId; if(v) tally[v]=(tally[v]||0)+1; });
    let top=null,topN=-1;
    Object.keys(tally).forEach(k=>{ if(tally[k]>topN){ topN=tally[k]; top=k; } });
    if(top){ addLog('👉 가장 많이 지목된 '+nameOf(top)+'님이 카드를 버립니다.'); enqueuePrompt({forId:top,type:'chooseDiscard',payload:{n:3}}); }
    else addLog('아무도 지목되지 않았습니다.');
  }
  state.discard.push(ev.cardId);
  processPromptQueue(()=>{ finishMainAction(); });
}
function startMinigame(card,ev){
  state.phase='minigame';
  addLog('🎲 미니게임: ['+card.name+'] — '+nameOf(ev.sourceId)+(ev.targetId?' vs '+nameOf(ev.targetId):''));
  if(card.minigame==='rps'||card.minigame==='holdDuel'){
    enqueuePromptMulti([ev.sourceId,ev.targetId], card.minigame==='rps'?'rpsChoice':'holdDuel', {});
    return;
  }
  if(card.minigame==='reactionRace'||card.minigame==='secretVote'){
    enqueuePromptMulti(state.players.map(p=>p.id), card.minigame, {});
    return;
  }
  if(card.minigame==='coinflip'){
    const heads=Math.random()<0.5;
    addLog(heads?'🪙 앞면! 카드 3장을 뽑습니다.':'🪙 뒷면! 카드 3장을 버려야 합니다.');
    if(heads) drawCards(ev.sourceId,3); else enqueuePrompt({forId:ev.sourceId,type:'chooseDiscard',payload:{n:3}});
    state.discard.push(ev.cardId);
    processPromptQueue(()=>finishMainAction());
    return;
  }
  if(card.minigame==='flavor'){
    addLog('📸 다 같이 모여 추억을 남겼습니다.');
    state.discard.push(ev.cardId);
    processPromptQueue(()=>finishMainAction());
    return;
  }
  if(card.minigame==='selfJudge') enqueuePrompt({forId:ev.sourceId,type:'selfJudge',payload:{judgeText:card.judgeText}});
  else if(card.minigame==='selfJudgeWinner') enqueuePrompt({forId:ev.sourceId,type:'selfJudgeWinner',payload:{n:card.n||3}});
  else if(card.minigame==='guessCount') enqueuePrompt({forId:ev.sourceId,type:'guessCount',payload:{targetId:ev.targetId}});
  state.discard.push(ev.cardId);
  processPromptQueue(()=>finishMainAction());
}

/* ---- 카드 효과 해석기 ---- */
function applyBaseEffect(fx,ev,extraTargetIds){
  const negated=ev.negatedFor||[];
  const applyToSingle=(pid,fn)=>{ if(!pid) return; if(negated.indexOf(pid)>=0) return; fn(pid); };
  switch((fx||{}).k){
    case 'noop': addLog('...아무 일도 일어나지 않았습니다.'); break;
    case 'draw': {
      if(fx.who==='all') state.players.forEach(p=>applyToSingle(p.id,id=>drawCards(id,fx.n,{fromBottom:fx.fromBottom,reveal:fx.reveal})));
      else if(fx.who==='others') otherPlayers(ev.sourceId).forEach(p=>applyToSingle(p.id,id=>drawCards(id,fx.n,{fromBottom:fx.fromBottom,reveal:fx.reveal})));
      else { const pid=resolveWho(fx.who,ev); applyToSingle(pid,id=>drawCards(id,fx.n,{fromBottom:fx.fromBottom,reveal:fx.reveal})); (extraTargetIds||[]).forEach(t=>applyToSingle(t,id=>drawCards(id,fx.n))); }
      break;
    }
    case 'discard': {
      const doOne=(pid)=>applyToSingle(pid,id=>enqueuePrompt({forId:id,type:'chooseDiscard',payload:{n:fx.n}}));
      if(fx.who==='all') state.players.forEach(p=>doOne(p.id));
      else if(fx.who==='others') otherPlayers(ev.sourceId).forEach(p=>doOne(p.id));
      else if(fx.who==='randomOther'){ const ops=otherPlayers(ev.sourceId); if(ops.length) doOne(ops[Math.floor(Math.random()*ops.length)].id); }
      else { doOne(resolveWho(fx.who,ev)); (extraTargetIds||[]).forEach(t=>doOne(t)); }
      break;
    }
    case 'discardType': {
      const pid=resolveWho(fx.who,ev); const p=findPlayer(pid);
      const toDiscard=p.hand.filter(c=>CARD_MAP[c].type===fx.cardType);
      toDiscard.forEach(c=>{ const i=p.hand.indexOf(c); p.hand.splice(i,1); state.discard.push(c); });
      addLog(nameOf(pid)+'님의 '+fx.cardType+' 카드가 모두 버려졌습니다.');
      break;
    }
    case 'steal': { const from=resolveWho(fx.from,ev), to=resolveWho(fx.to,ev); doSteal(from,to,fx.n); (extraTargetIds||[]).forEach(t=>doSteal(t,to,fx.n)); break; }
    case 'stealAll': { doSteal(resolveWho(fx.from,ev), resolveWho(fx.to,ev), 'all'); break; }
    case 'giveAll': {
      const from=resolveWho(fx.from,ev), to=resolveWho(fx.to,ev);
      const p=findPlayer(from), t=findPlayer(to);
      t.hand.push(...p.hand); p.hand=[];
      addLog(nameOf(from)+'님이 손패 전부를 '+nameOf(to)+'님에게 넘겼습니다.');
      checkCardSick(to);
      break;
    }
    case 'giveN': { enqueuePrompt({forId:resolveWho(fx.from,ev),type:'chooseGive',payload:{n:fx.n,toId:resolveWho(fx.to,ev)}}); break; }
    case 'swap': {
      const a=ev.sourceId,b=ev.targetId; const pa=findPlayer(a),pb=findPlayer(b);
      const tmp=pa.hand; pa.hand=pb.hand; pb.hand=tmp;
      addLog(nameOf(a)+'님과 '+nameOf(b)+'님의 손패가 서로 바뀌었습니다.');
      checkCardSick(a); checkCardSick(b);
      break;
    }
    case 'skip': { const pid=resolveWho(fx.who,ev); markSkip(pid); addLog(nameOf(pid)+'님은 다음 차례를 쉽니다.'); break; }
    case 'reverse': { state.direction*=-1; addLog('🔁 게임 진행 방향이 반대로 바뀌었습니다.'); break; }
    case 'removeTraps': {
      if(fx.who==='all') state.players.forEach(p=>{ state.discard.push(...p.traps); p.traps=[]; });
      else { const pid=resolveWho(fx.who,ev); const p=findPlayer(pid); state.discard.push(...p.traps); p.traps=[]; }
      addLog('💣 함정 카드가 모두 버려졌습니다.');
      break;
    }
    case 'revealTrap': { const pid=resolveWho(fx.who,ev); const p=findPlayer(pid); state.discard.push(...p.traps); p.traps=[]; addLog(nameOf(pid)+'님의 함정 카드가 모두 무효화되었습니다.'); break; }
    case 'stealTrap': {
      const pid=resolveWho(fx.who,ev); const victim=findPlayer(pid);
      if(victim.traps.length===0){ addLog(nameOf(pid)+'님은 설치한 함정이 없습니다.'); break; }
      enqueuePrompt({forId:ev.sourceId,type:'pickTrapSlot',payload:{victimId:pid,slotCount:victim.traps.length}});
      break;
    }
    case 'viewTopTake1': {
      const opts=[];
      for(let i=0;i<fx.n;i++){ if(state.deck.length===0) reshuffleDiscardIntoDeck(); if(state.deck.length===0) break; opts.push(fx.fromBottom?state.deck.shift():state.deck.pop()); }
      if(opts.length===0) break;
      enqueuePrompt({forId:ev.sourceId,type:'pickFromReveal',payload:{options:opts}});
      break;
    }
    case 'redistributeTwo': {
      const a=ev.sourceId,b=ev.targetId; const pa=findPlayer(a),pb=findPlayer(b);
      const pool=shuffle([...pa.hand,...pb.hand]); const half=Math.ceil(pool.length/2);
      pa.hand=pool.slice(0,half); pb.hand=pool.slice(half);
      addLog(nameOf(a)+'님과 '+nameOf(b)+'님이 손패를 합쳐 다시 나눠 가졌습니다.');
      checkCardSick(a); checkCardSick(b);
      break;
    }
    case 'restart': { doRestartGame(); ev.skipAdvance=true; break; }
    case 'setWinRuleAt': { state.ruleFlags.winRuleAt={who:ev.sourceId,rule:fx.rule}; addLog(nameOf(ev.sourceId)+'님의 다음 차례에 특수 승리 조건이 적용됩니다.'); break; }
    case 'custom': { applyCustom(fx.id,fx,ev); break; }
    default: break;
  }
}
function doRestartGame(){
  let all=[];
  state.players.forEach(p=>{ all.push(...p.hand,...p.traps); p.hand=[]; p.traps=[]; });
  all.push(...state.deck,...state.discard);
  state.deck=shuffle(all); state.discard=[];
  state.players.forEach(p=>{ p.hand=state.deck.splice(state.deck.length-3,3); });
  state.winThreshold=10;
  state.ruleFlags={winRuleAt:null,lockActionsUntil:null,lockWinUntil:null,extraActionsFor:null,extraActionsCount:0};
  state.skipSet={};
  state.turnIndex=0; state.currentId=state.order[0]; state.direction=1;
  addLog('💥 모든 카드를 모아 다시 섞고, 게임을 처음부터 다시 시작합니다!');
}
function applyCustom(id,fx,ev){
  switch(id){
    case 'bigBee': {
      const m=maxHand(); if(m.length!==1){ addLog('손패가 가장 많은 사람이 동률이라 효과가 무산되었습니다.'); break; }
      const target=m[0].id; otherPlayers(target).forEach(p=>doSteal(target,p.id,1));
      break;
    }
    case 'iLikeTrains': {
      const n=state.order.length; const snap=state.order.map(id=>findPlayer(id).hand);
      state.order.forEach((id,i)=>{ findPlayer(id).hand=snap[(i-1+n)%n].slice(); });
      state.order.forEach(id=>checkCardSick(id));
      addLog('🚂 모두의 손패가 이전 사람과 통째로 뒤바뀌었습니다.');
      break;
    }
    case 'skateboards': {
      const n=state.order.length; const snap=state.order.map(id=>findPlayer(id).hand);
      state.order.forEach((id,i)=>{ findPlayer(id).hand=snap[(i+1)%n].slice(); });
      state.order.forEach(id=>checkCardSick(id));
      addLog('🛹 모두의 손패가 다음 사람과 통째로 뒤바뀌었습니다.');
      break;
    }
    case 'hereItComes': {
      const n=state.order.length; const original=state.order.map(id=>findPlayer(id).hand.slice());
      state.order.forEach((id,i)=>{
        const prevIdx=(i-1+n)%n; if(prevIdx===i) return;
        if(original[prevIdx].length>0){
          const card=original[prevIdx][Math.floor(Math.random()*original[prevIdx].length)];
          const pf=findPlayer(state.order[prevIdx]); const pt=findPlayer(id);
          const idx=pf.hand.indexOf(card); if(idx>=0){ pf.hand.splice(idx,1); pt.hand.push(card); }
        }
      });
      addLog('👋 모두가 이전 사람에게서 카드를 1장씩 빼앗았습니다.');
      break;
    }
    case 'yayCookies': { otherPlayers(ev.sourceId).forEach(p=>doSteal(p.id,ev.sourceId,1)); break; }
    case 'killedUsAll': {
      enqueuePrompt({forId:ev.sourceId,type:'chooseDiscard',payload:{n:2}});
      otherPlayers(ev.sourceId).forEach(p=>enqueuePrompt({forId:p.id,type:'chooseDiscard',payload:{n:1}}));
      break;
    }
    case 'levelUp': { drawCards(ev.sourceId,2); otherPlayers(ev.sourceId).forEach(p=>drawCards(p.id,1)); break; }
    case 'noLlama': {
      const all=state.players.map(p=>p.id); const half=Math.max(1,Math.floor(all.length/2));
      shuffle(all).slice(0,half).forEach(id=>enqueuePrompt({forId:id,type:'chooseDiscard',payload:{n:1}}));
      break;
    }
    case 'cakeDay': {
      const all=state.players.map(p=>p.id); const lucky=all[Math.floor(Math.random()*all.length)];
      addLog('🎂 '+nameOf(lucky)+'님이 오늘의 생일 주인공입니다!');
      otherPlayers(lucky).forEach(p=>enqueuePrompt({forId:p.id,type:'chooseGive',payload:{n:1,toId:lucky}}));
      break;
    }
    case 'newYou': {
      const p=findPlayer(ev.sourceId); const n=p.hand.length;
      state.discard.push(...p.hand); p.hand=[];
      drawCards(ev.sourceId,n);
      addLog(nameOf(ev.sourceId)+'님이 손패를 완전히 새로 갈아치웠습니다.');
      break;
    }
    case 'fewestDraw3': { minHand().forEach(p=>drawCards(p.id,3)); break; }
    case 'timeMachine': {
      if(state.discard.length===0){ addLog('버린 카드 더미가 비어있습니다.'); break; }
      const idx=Math.floor(Math.random()*state.discard.length); const c=state.discard.splice(idx,1)[0];
      findPlayer(ev.sourceId).hand.push(c);
      addLog(nameOf(ev.sourceId)+'님이 버린 카드 더미에서 ['+CARD_MAP[c].name+']를 되찾았습니다.');
      checkCardSick(ev.sourceId);
      break;
    }
    case 'adoptTop3': {
      const n=Math.min(3,state.discard.length); const taken=state.discard.splice(state.discard.length-n,n);
      findPlayer(ev.sourceId).hand.push(...taken);
      addLog(nameOf(ev.sourceId)+'님이 버린 카드 더미에서 '+n+'장을 가져왔습니다.');
      checkCardSick(ev.sourceId);
      break;
    }
    case 'extraActions': { state.ruleFlags.extraActionsFor=ev.sourceId; state.ruleFlags.extraActionsCount=fx.n; addLog(nameOf(ev.sourceId)+'님은 이번 차례에 행동 카드를 '+fx.n+'번 더 사용할 수 있습니다.'); break; }
    case 'lockActions': { state.ruleFlags.lockActionsUntil=ev.sourceId; addLog(nameOf(ev.sourceId)+'님의 다음 차례까지 아무도 행동 카드를 사용할 수 없습니다.'); break; }
    case 'lockWin': { state.ruleFlags.lockWinUntil=ev.sourceId; addLog(nameOf(ev.sourceId)+'님의 다음 차례까지 아무도 승리할 수 없습니다.'); break; }
    case 'stealOrDraw': { enqueuePrompt({forId:ev.sourceId,type:'stealOrDraw',payload:{n:fx.n,targetId:ev.targetId}}); break; }
    default: break;
  }
}

/* ---- 카운터 처리 ---- */
function applyCounterFx(card,counterPlayerId,chosenTargetId){
  const ev=state.pendingEvent; const fx=card.fx;
  switch(fx.k){
    case 'counterCancel': ev.cancelled=true; break;
    case 'counterCancelReturn': ev.cancelled=true; ev.returnToSource=true; break;
    case 'counterNegateSelf': ev.negatedFor.push(counterPlayerId); break;
    case 'counterHijack': ev.sourceId=counterPlayerId; break;
    case 'counterCancelSteal': ev.cancelled=true; ev.stolenBy=counterPlayerId; break;
    case 'counterCancelCounterSteal': ev.cancelled=true; ev.stolenBy=counterPlayerId; break;
    case 'counterRedirect': ev.targetId=chosenTargetId||ev.targetId; break;
    case 'counterShare': ev.extraTargets.push(fx.addTarget==='source'?ev.sourceId:(chosenTargetId||null)); break;
    case 'counterReverseSteal': {
      ev.cancelled=true;
      const baseFx=CARD_MAP[ev.cardId].fx; const n=(baseFx&&baseFx.n)||1;
      doSteal(ev.sourceId,counterPlayerId,n);
      break;
    }
    default: break;
  }
}
function applyImmediateSub(subFx,counterPlayerId){
  const ev=state.pendingEvent;
  const rw=(w)=> w==='self'?counterPlayerId:(w==='sourceOfEvent'?ev.sourceId:w);
  if(subFx.k==='passTurnTo') ev.forceNextTurnTo=rw(subFx.who);
  else if(subFx.k==='discard') enqueuePrompt({forId:rw(subFx.who),type:'chooseDiscard',payload:{n:subFx.n}});
  else if(subFx.k==='removeTraps'){ const pid2=rw(subFx.who); const p2=findPlayer(pid2); state.discard.push(...p2.traps); p2.traps=[]; }
  else if(subFx.k==='skip') markSkip(rw(subFx.who));
  else if(subFx.k==='draw') drawCards(rw(subFx.who),subFx.n);
  else if(subFx.k==='drawFromEventN'){ const baseFx=CARD_MAP[ev.cardId].fx; const n=(baseFx&&baseFx.n)||1; drawCards(rw(subFx.who),n); }
}
function openCounterWindow(){
  state.phase='counterWindow';
  const ev=state.pendingEvent; const card=CARD_MAP[ev.cardId];
  ev.deadline=Date.now()+9000;
  if(!ev.announced){
    ev.announced=true;
    if(ev.isTrap) addLog('⚠️ 함정 발동: '+nameOf(ev.sourceId)+'님의 ['+card.name+']!'+(ev.targetId?' (대상: '+nameOf(ev.targetId)+')':''));
    else addLog('▶ '+nameOf(ev.sourceId)+'님이 ['+card.name+'] 카드를 사용했습니다.'+(ev.targetId?' (대상: '+nameOf(ev.targetId)+')':''));
  }
  broadcastAll();
  const mySeq=++state._counterSeq_val;
  state.counterTimer=setTimeout(()=>{ if(state._counterSeq_val===mySeq && state.phase==='counterWindow') resolveEventNow(); },9000);
}
function hostPlayCounter(pid,cardId,chosenTargetId){
  if(state.phase!=='counterWindow'||!state.pendingEvent) return;
  const p=findPlayer(pid); const idx=p.hand.indexOf(cardId); if(idx<0) return;
  const card=CARD_MAP[cardId]; if(!card||card.type!=='counter') return;
  clearTimeout(state.counterTimer);
  p.hand.splice(idx,1); state.discard.push(cardId);
  addLog('🛡 '+nameOf(pid)+'님이 카운터 ['+card.name+']를 사용했습니다!');
  applyCounterFx(card,pid,chosenTargetId);
  if(card.then) applyImmediateSub(card.then,pid);
  state.pendingEvent.depth=(state.pendingEvent.depth||0)+1;
  if(state.pendingEvent.cancelled || state.pendingEvent.depth>=4) resolveEventNow();
  else openCounterWindow();
}
function resolveEventNow(){
  const ev=state.pendingEvent; const card=CARD_MAP[ev.cardId];
  if(ev.cancelled){
    if(ev.returnToSource){ findPlayer(ev.sourceId).hand.push(ev.cardId); addLog('['+card.name+'] 카드가 취소되어 손으로 돌아갔습니다.'); }
    else if(ev.stolenBy){ findPlayer(ev.stolenBy).hand.push(ev.cardId); addLog('['+card.name+'] 카드가 취소되어 다른 사람이 가져갔습니다.'); }
    else { state.discard.push(ev.cardId); addLog('['+card.name+'] 효과가 취소되었습니다.'); }
    finalizeEvent();
    return;
  }
  state.discard.push(ev.cardId);
  const targets=[ev.targetId].concat(ev.extraTargets||[]).filter(Boolean);
  applyBaseEffect(card.fx||{k:'noop'},ev,targets);
  finalizeEvent();
}
function finalizeEvent(){
  const ev=state.pendingEvent;
  const wasTrap=ev.isTrap, skipAdvance=ev.skipAdvance, priorPhase=ev.priorPhase, autoChainDeclarer=ev.autoChainDeclarer;
  state.forceNextTurnTo = ev.forceNextTurnTo || state.forceNextTurnTo || null;
  state.pendingEvent=null;
  processPromptQueue(()=>{
    if(state.phase==='gameover') return;
    if(skipAdvance){ startTurn(); return; }
    if(wasTrap){
      state.phase=priorPhase||'main';
      if(state.autoTrapQueue && state.autoTrapQueue.length>0){ pumpAutoTrapQueue(autoChainDeclarer); return; }
      broadcastAll();
    } else finishMainAction();
  });
}

/* ---- 함정 설치/발동 ---- */
function hostInstallTrap(pid,cardId){
  if(!state||state.phase!=='trap'||state.currentId!==pid) return;
  const p=findPlayer(pid); const idx=p.hand.indexOf(cardId); if(idx<0) return;
  const card=CARD_MAP[cardId]; if(!card||card.type!=='trap') return;
  if(p.traps.length>=3){ toastTo(pid,'함정은 최대 3장까지 설치할 수 있어요.'); return; }
  p.hand.splice(idx,1); p.traps.push(cardId);
  addLog('🔻 '+nameOf(pid)+'님이 함정 카드를 설치했습니다.');
  state.phase='main';
  broadcastAll();
}
function hostPassTrap(pid){ if(!state||state.phase!=='trap'||state.currentId!==pid) return; state.phase='main'; broadcastAll(); }
function hostMainDraw(pid){
  if(!state||state.phase!=='main'||state.currentId!==pid) return;
  drawCards(pid,1);
  finishMainAction();
}
function hostPlayCard(pid,cardId,targetId,targetId2){
  if(!state||state.phase!=='main'||state.currentId!==pid) return;
  if(state.ruleFlags.lockActionsUntil){ toastTo(pid,'지금은 행동 카드를 사용할 수 없습니다.'); return; }
  const p=findPlayer(pid); const idx=p.hand.indexOf(cardId); if(idx<0) return;
  const card=CARD_MAP[cardId]; if(!card||(card.type!=='action'&&card.type!=='minigame')) return;
  if(cardNeedsTarget(card) && !targetId){ toastTo(pid,'대상을 선택하세요.'); return; }
  if(cardNeedsTarget2(card) && !targetId2){ toastTo(pid,'대상을 선택하세요.'); return; }
  p.hand.splice(idx,1);
  const ev={cardId,sourceId:pid,targetId:targetId||null,targetId2:targetId2||null,isTrap:false,uncounterable:!!card.uncounterable,cancelled:false,returnToSource:false,negatedFor:[],extraTargets:[],depth:0};
  state.pendingEvent=ev;
  if(card.type==='minigame'){ startMinigame(card,ev); return; }
  if(card.uncounterable){ addLog('▶ '+nameOf(pid)+'님이 ['+card.name+'] 카드를 사용했습니다.'+(targetId?' (대상: '+nameOf(targetId)+')':'')); resolveEventNow(); }
  else openCounterWindow();
}
function hostTriggerTrap(pid,trapCardId,targetId){
  if(!state) return;
  if(state.phase==='counterWindow'||state.phase==='promptWait'||state.phase==='minigame'||state.phase==='gameover'){ toastTo(pid,'지금은 다른 이벤트가 진행 중이에요. 잠시 후 다시 시도하세요.'); return; }
  const p=findPlayer(pid); if(!p) return;
  const idx=p.traps.indexOf(trapCardId); if(idx<0) return;
  const card=CARD_MAP[trapCardId]; if(!card||card.type!=='trap'||card.trigger==='passive') return;
  if(card.condition==='handEmpty' && p.hand.length!==0){ toastTo(pid,'이 함정은 손패가 0장일 때만 발동할 수 있어요.'); return; }
  const needsT=cardNeedsTarget(card);
  if(needsT && !targetId){ toastTo(pid,'대상을 선택하세요.'); return; }
  if(needsT && targetId===pid){ toastTo(pid,'자기 자신은 지목할 수 없어요.'); return; }
  p.traps.splice(idx,1);
  const priorPhase=state.phase;
  state.pendingEvent={cardId:trapCardId,sourceId:pid,targetId:needsT?targetId:null,targetId2:null,isTrap:true,uncounterable:false,cancelled:false,returnToSource:false,negatedFor:[],extraTargets:[],depth:0,priorPhase};
  openCounterWindow();
}
function hostDeclareMuffinTime(pid){
  if(!state) return;
  if(state.phase==='counterWindow'||state.phase==='promptWait'||state.phase==='minigame') return;
  const p=findPlayer(pid); if(!p||p.hand.length!==state.winThreshold) return;
  addLog('🧁 '+nameOf(pid)+'님이 "머핀 타임!"을 외쳤습니다!');
  const owners=[];
  state.players.forEach(pl=>{ if(pl.id!==pid) pl.traps.forEach(tid=>{ if(CARD_MAP[tid].hookOn==='declareMuffinTime') owners.push({ownerId:pl.id,trapCardId:tid}); }); });
  state.autoTrapQueue=owners;
  pumpAutoTrapQueue(pid);
}
function pumpAutoTrapQueue(declarerId){
  if(!state.autoTrapQueue || state.autoTrapQueue.length===0){ broadcastAll(); return; }
  const next=state.autoTrapQueue.shift();
  const owner=findPlayer(next.ownerId); if(!owner){ pumpAutoTrapQueue(declarerId); return; }
  const idx=owner.traps.indexOf(next.trapCardId); if(idx<0){ pumpAutoTrapQueue(declarerId); return; }
  owner.traps.splice(idx,1);
  const priorPhase=state.phase;
  state.pendingEvent={cardId:next.trapCardId,sourceId:next.ownerId,targetId:declarerId,targetId2:null,isTrap:true,uncounterable:false,cancelled:false,returnToSource:false,negatedFor:[],extraTargets:[],depth:0,priorPhase,autoChainDeclarer:declarerId};
  openCounterWindow();
}

/* ---- 네트워크 브로드캐스트 ---- */
function toastTo(pid,text){ if(pid===myId) showToast(text); else if(guestConns[pid]&&guestConns[pid].open) guestConns[pid].send({type:'TOAST',text}); }
function broadcastToast(text){ state.players.forEach(p=>toastTo(p.id,text)); }
function buildView(pid){
  return {
    myId: pid,
    players: state.players.map(p=>({id:p.id,name:p.name,handCount:p.hand.length,trapCount:p.traps.length,connected:p.connected!==false})),
    myHand: (findPlayer(pid)||{hand:[]}).hand.slice(),
    myTraps: (findPlayer(pid)||{traps:[]}).traps.slice(),
    order: state.order.slice(), turnIndex: state.turnIndex, direction: state.direction, currentId: state.currentId,
    deckCount: state.deck.length,
    discardTopId: state.discard.length ? state.discard[state.discard.length-1] : null,
    discardCount: state.discard.length,
    winThreshold: state.winThreshold,
    phase: state.phase,
    pendingEvent: state.pendingEvent ? {cardId:state.pendingEvent.cardId,sourceId:state.pendingEvent.sourceId,targetId:state.pendingEvent.targetId,isTrap:state.pendingEvent.isTrap,uncounterableFlag:state.pendingEvent.uncounterable,deadline:state.pendingEvent.deadline} : null,
    myPrompt: (state.pendingPrompt && state.pendingPrompt.forId===pid) ? state.pendingPrompt : null,
    myMultiPrompt: (state.pendingMultiPrompt && state.pendingMultiPrompt.forIds.indexOf(pid)>=0 && !(pid in state.pendingMultiPrompt.responses)) ? {id:state.pendingMultiPrompt.id,type:state.pendingMultiPrompt.type,payload:state.pendingMultiPrompt.payload,deadline:state.pendingMultiPrompt.deadline} : null,
    waitingOnOthers: !!((state.pendingPrompt && state.pendingPrompt.forId!==pid) || (state.pendingMultiPrompt && Object.keys(state.pendingMultiPrompt.responses).length < state.pendingMultiPrompt.forIds.length)),
    log: state.log.slice(-60),
    winnerId: state.winnerId
  };
}
function broadcastAll(){
  state.players.forEach(p=>{
    const view=buildView(p.id);
    if(p.id===myId) applyView(view);
    else if(guestConns[p.id] && guestConns[p.id].open) guestConns[p.id].send({type:'STATE',view});
  });
}
function hostHandleMessage(fromId,msg){
  if(msg.type==='HELLO'){
    if(state){ const p=findPlayer(fromId); if(p){ p.connected=true; broadcastAll(); } return; }
    if(!lobbyPlayers.find(p=>p.id===fromId)) lobbyPlayers.push({id:fromId,name:msg.name||'게스트'});
    broadcastLobby();
  } else if(msg.type==='ACTION'){
    hostHandleAction(fromId,msg.action);
  }
}
function hostHandleAction(pid,action){
  if(!state) return;
  switch(action.type){
    case 'INSTALL_TRAP': hostInstallTrap(pid,action.cardId); break;
    case 'PASS_TRAP': hostPassTrap(pid); break;
    case 'DRAW_CARD': hostMainDraw(pid); break;
    case 'PLAY_ACTION': hostPlayCard(pid,action.cardId,action.targetId,action.targetId2); break;
    case 'TRIGGER_TRAP': hostTriggerTrap(pid,action.trapCardId,action.targetId); break;
    case 'PLAY_COUNTER': hostPlayCounter(pid,action.cardId,action.chosenTargetId); break;
    case 'PROMPT_RESPONSE': hostPromptResponse(pid,action.requestId,action.payload); break;
    case 'MULTI_RESPONSE': hostMultiResponse(pid,action.requestId,action.payload); break;
    case 'DECLARE_MT': hostDeclareMuffinTime(pid); break;
    default: break;
  }
}
function hostInit(playersInfo){
  const deck=buildDeck();
  const players=playersInfo.map(pi=>({id:pi.id,name:pi.name,hand:[],traps:[],connected:true}));
  players.forEach(p=>{ p.hand=deck.splice(deck.length-3,3); });
  state={
    players, order:players.map(p=>p.id), turnIndex:0, direction:1, currentId:players[0].id,
    deck, discard:[], winThreshold:10, phase:'trap',
    pendingEvent:null, pendingPrompt:null, pendingMultiPrompt:null, promptQueue:[], onQueueDrained:null,
    ruleFlags:{winRuleAt:null,lockActionsUntil:null,lockWinUntil:null,extraActionsFor:null,extraActionsCount:0},
    skipSet:{}, log:[], winnerId:null, _counterSeq_val:0, autoTrapQueue:[], forceNextTurnTo:null
  };
  addLog('🎮 게임을 시작합니다! 첫 차례: '+nameOf(state.currentId));
  document.getElementById('lobby').style.display='none';
  document.getElementById('game').style.display='flex';
  broadcastAll();
}
function dispatchAction(action){
  if(isHost) hostHandleAction(myId,action);
  else if(hostConn && hostConn.open) hostConn.send({type:'ACTION',action});
}

function genShortId(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r=''; for(let i=0;i<4;i++) r+=chars.charAt(Math.floor(Math.random()*chars.length)); return r; }

document.getElementById('createRoomBtn').onclick=()=>{
  myName=(document.getElementById('nickInput').value||'호스트').slice(0,8) || '호스트';
  isHost=true;
  peer=new Peer(genShortId());
  peer.on('open',id=>{
    myId=id;
    document.getElementById('myRoomIdBox').style.display='block';
    document.getElementById('myRoomIdBox').textContent=id;
    document.getElementById('createRoomBtn').style.display='none';
    document.getElementById('startGameBtn').style.display='block';
    lobbyPlayers=[{id:myId,name:myName}];
    broadcastLobby();
  });
  peer.on('connection',conn=>{
    conn.on('open',()=>{
      guestConns[conn.peer]=conn;
      conn.on('data',data=>hostHandleMessage(conn.peer,data));
      conn.on('close',()=>{
        delete guestConns[conn.peer];
        lobbyPlayers=lobbyPlayers.filter(p=>p.id!==conn.peer);
        broadcastLobby();
      });
    });
  });
};

    hostConn.on('open',()=>{
      hostConn.send({type:'HELLO',name:myName});
      document.getElementById('lobbyStatus').textContent='방에 연결되었습니다. 호스트가 게임을 시작하길 기다리는 중...';
    });
    hostConn.on('data',msg=>guestHandleMessage(msg));
  });
};

document.getElementById('startGameBtn').onclick=()=>{
  if(!isHost) return;
  if(lobbyPlayers.length<2){ alert('최소 2명 이상 모여야 시작할 수 있습니다.'); return; }
  hostInit(lobbyPlayers);
};

window.MuffinTime={ mount: function(){ /* 웹 단독 실행 모드 지원 */ } };
})();
</script>
</body>
</html>
