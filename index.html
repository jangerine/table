<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile Tabletop Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; touch-action: none; font-family: sans-serif; background-color: #111; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; font-size: 12px; }
    input, button { font-size: 12px; margin: 2px; }
    #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
    #controls button { padding: 8px 16px; font-weight: bold; background: #27ae60; color: white; border: none; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="ui">
  <div>내 ID: <span id="my-id">생성 중...</span></div>
  <input type="text" id="join-id" placeholder="상대 ID 입력">
  <button id="connect-btn">연결</button>
  <div id="status">오프라인</div>
</div>

<div id="controls">
  <button id="roll-btn">주사위 굴리기 🎲</button>
</div>

<script>
  // 1. Scene 및 카메라 설정
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 11, 9);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // 2. OrbitControls (카메라 확대/축소 및 회전)
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 4;
  controls.maxDistance = 22;
  controls.target.set(0, 0.2, 0);

  // 조명 설정
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
  dirLight.position.set(6, 12, 6);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  // 3. TTS 동적 텍스처 생성 함수 (원목 & 펠트 매트)
  function createWoodTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#5c3a21'; ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = '#4a2e19';
    for (let i = 0; i < 50; i++) {
      ctx.fillRect(0, i * 10, 512, 3 + Math.random() * 2);
    }
    return new THREE.CanvasTexture(canvas);
  }

  function createFeltMatTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    // 초록색 펠트 베이스
    ctx.fillStyle = '#1b4d2e'; ctx.fillRect(0, 0, 512, 512);
    // 내각 테두리 흰색 라인 (TTS 전형적 디자인)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 6;
    ctx.strokeRect(20, 20, 472, 472);
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 28, 456, 456);
    return new THREE.CanvasTexture(canvas);
  }

  // 4. TTS 보드/테이블 구조물 생성 (팔각형 원목 테두리 + 펠트 상판)
  const woodTexture = createWoodTexture();
  const feltTexture = createFeltMatTexture();

  // (1) 원목 베이스 테이블
  const tableShape = new THREE.Shape();
  const w = 6, h = 6, r = 1.2;
  tableShape.moveTo(-w + r, -h); tableShape.lineTo(w - r, -h);
  tableShape.lineTo(w, -h + r); tableShape.lineTo(w, h - r);
  tableShape.lineTo(w - r, h); tableShape.lineTo(-w + r, h);
  tableShape.lineTo(-w, h - r); tableShape.lineTo(-w, -h + r);
  tableShape.closePath();

  const extrudeSettings = { depth: 0.3, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.1, bevelThickness: 0.1 };
  const tableGeo = new THREE.ExtrudeGeometry(tableShape, extrudeSettings);
  tableGeo.rotateX(Math.PI / 2);
  const tableMat = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.6 });
  const tableMesh = new THREE.Mesh(tableGeo, tableMat);
  tableMesh.position.y = -0.15;
  tableMesh.receiveShadow = true;
  scene.add(tableMesh);

  // (2) 중앙 펠트 플레이 매트 (TTS 스타일)
  const matGeo = new THREE.PlaneGeometry(10.5, 10.5);
  const matMaterial = new THREE.MeshStandardMaterial({ map: feltTexture, roughness: 0.8 });
  const boardMatMesh = new THREE.Mesh(matGeo, matMaterial);
  boardMatMesh.rotation.x = -Math.PI / 2;
  boardMatMesh.position.y = 0.26;
  boardMatMesh.receiveShadow = true;
  scene.add(boardMatMesh);

  const objects = [];

  // 5. 카드 & 주사위 생성
  function createCard(id, x, z) {
    const geo = new THREE.BoxGeometry(1.2, 0.02, 1.8);
    const frontTex = createTextTexture('CARD');
    const backTex = createTextTexture('🂠', '#b22222');

    const materials = [
      new THREE.MeshStandardMaterial({ color: 0xdddddd }),
      new THREE.MeshStandardMaterial({ color: 0xdddddd }),
      new THREE.MeshStandardMaterial({ map: frontTex }),
      new THREE.MeshStandardMaterial({ map: backTex }),
      new THREE.MeshStandardMaterial({ color: 0xdddddd }),
      new THREE.MeshStandardMaterial({ color: 0xdddddd })
    ];

    const card = new THREE.Mesh(geo, materials);
    card.position.set(x, 0.28, z);
    card.castShadow = true;
    card.userData = { id: id, type: 'card', isFlipped: false, isAnimating: false };
    scene.add(card);
    objects.push(card);
    return card;
  }

  function createTextTexture(text, bgColor = '#ffffff') {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = bgColor === '#ffffff' ? '#000000' : '#ffffff';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  let diceMesh = null;
  function createDice(id, x, z) {
    const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.3 });
    diceMesh = new THREE.Mesh(geo, mat);
    diceMesh.position.set(x, 0.66, z);
    diceMesh.castShadow = true;
    diceMesh.userData = { id: id, type: 'dice', isRolling: false };
    scene.add(diceMesh);
    objects.push(diceMesh);
  }

  // 기본 배치
  createCard('card1', -2, 0);
  createCard('card2', 0, 0);
  createDice('dice1', 2, 0);

  // 6. 터치 및 드래그 조작 연동
  const raycaster = new THREE.Raycaster();
  const touch = new THREE.Vector2();
  let selectedObj = null;
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.26); // 보드 매트 수평 높이에 고정
  let touchStartTime = 0;
  let touchStartPos = { x: 0, y: 0 };

  function getTouchPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX / window.innerWidth) * 2 - 1,
      y: -(t.clientY / window.innerHeight) * 2 + 1,
      rawX: t.clientX, rawY: t.clientY
    };
  }

  function onTouchStart(e) {
    if (e.touches && e.touches.length > 1) {
      selectedObj = null;
      controls.enabled = true;
      return;
    }

    const pos = getTouchPos(e);
    touch.x = pos.x; touch.y = pos.y;
    touchStartTime = Date.now();
    touchStartPos = { x: pos.rawX, y: pos.rawY };

    raycaster.setFromCamera(touch, camera);
    const intersects = raycaster.intersectObjects(objects);

    if (intersects.length > 0) {
      selectedObj = intersects[0].object;
      controls.enabled = false;
    } else {
      selectedObj = null;
      controls.enabled = true;
    }
  }

  function onTouchMove(e) {
    if (!selectedObj) return;

    const pos = getTouchPos(e);
    touch.x = pos.x; touch.y = pos.y;

    raycaster.setFromCamera(touch, camera);
    const target = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, target);

    selectedObj.position.x = target.x;
    selectedObj.position.z = target.z;

    sendData({ type: 'move', id: selectedObj.userData.id, x: target.x, z: target.z });
  }

  function onTouchEnd(e) {
    if (selectedObj) {
      const touchDuration = Date.now() - touchStartTime;
      const lastPos = e.changedTouches ? e.changedTouches[0] : e;
      const dist = Math.hypot(lastPos.clientX - touchStartPos.x, lastPos.clientY - touchStartPos.y);

      if (touchDuration < 300 && dist < 10) {
        if (selectedObj.userData.type === 'card') {
          flipCard(selectedObj, true);
        } else if (selectedObj.userData.type === 'dice') {
          rollDice(selectedObj, true);
        }
      }
    }
    selectedObj = null;
    controls.enabled = true;
  }

  window.addEventListener('touchstart', onTouchStart, { passive: false });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, false);
  window.addEventListener('mousedown', onTouchStart, false);
  window.addEventListener('mousemove', onTouchMove, false);
  window.addEventListener('mouseup', onTouchEnd, false);

  // 7. 카드 뒤집기 애니메이션
  function flipCard(card, isLocal = false) {
    if (card.userData.isAnimating) return;
    card.userData.isAnimating = true;

    const targetRotZ = card.userData.isFlipped ? 0 : Math.PI;
    const startRotZ = card.rotation.z;
    let progress = 0;

    function animateFlip() {
      progress += 0.1;
      card.rotation.z = THREE.MathUtils.lerp(startRotZ, targetRotZ, progress);
      card.position.y = 0.28 + Math.sin(progress * Math.PI) * 0.5;

      if (progress < 1) {
        requestAnimationFrame(animateFlip);
      } else {
        card.rotation.z = targetRotZ;
        card.position.y = 0.28;
        card.userData.isFlipped = !card.userData.isFlipped;
        card.userData.isAnimating = false;
      }
    }
    animateFlip();

    if (isLocal) sendData({ type: 'flip', id: card.userData.id });
  }

  // 8. 주사위 굴리기 애니메이션
  function rollDice(dice, isLocal = false, targetRot = null) {
    if (dice.userData.isRolling) return;
    dice.userData.isRolling = true;

    const rotX = targetRot ? targetRot.x : Math.floor(Math.random() * 4) * (Math.PI / 2) + Math.PI * 4;
    const rotY = targetRot ? targetRot.y : Math.floor(Math.random() * 4) * (Math.PI / 2) + Math.PI * 4;
    const rotZ = targetRot ? targetRot.z : Math.floor(Math.random() * 4) * (Math.PI / 2) + Math.PI * 4;

    const startRot = { x: dice.rotation.x, y: dice.rotation.y, z: dice.rotation.z };
    let progress = 0;

    function animateRoll() {
      progress += 0.04;
      dice.rotation.x = THREE.MathUtils.lerp(startRot.x, rotX, progress);
      dice.rotation.y = THREE.MathUtils.lerp(startRot.y, rotY, progress);
      dice.rotation.z = THREE.MathUtils.lerp(startRot.z, rotZ, progress);
      dice.position.y = 0.66 + Math.abs(Math.sin(progress * Math.PI * 2)) * (1 - progress) * 2;

      if (progress < 1) {
        requestAnimationFrame(animateRoll);
      } else {
        dice.position.y = 0.66;
        dice.userData.isRolling = false;
      }
    }
    animateRoll();

    if (isLocal) sendData({ type: 'roll', id: dice.userData.id, targetRot: { x: rotX, y: rotY, z: rotZ } });
  }

  document.getElementById('roll-btn').addEventListener('click', () => {
    if (diceMesh) rollDice(diceMesh, true);
  });

  // 9. PeerJS 멀티플레이 통신
  const peer = new Peer();
  let conn = null;

  peer.on('open', id => document.getElementById('my-id').innerText = id);
  peer.on('connection', c => { conn = c; setupConnection(); });

  document.getElementById('connect-btn').addEventListener('click', () => {
    const targetId = document.getElementById('join-id').value;
    if (targetId) { conn = peer.connect(targetId); setupConnection(); }
  });

  function setupConnection() {
    document.getElementById('status').innerText = '연결됨!';
    conn.on('data', data => {
      const targetObj = objects.find(o => o.userData.id === data.id);
      if (!targetObj) return;

      if (data.type === 'move') {
        targetObj.position.x = data.x;
        targetObj.position.z = data.z;
      } else if (data.type === 'flip') {
        flipCard(targetObj, false);
      } else if (data.type === 'roll') {
        rollDice(targetObj, false, data.targetRot);
      }
    });
  }

  function sendData(data) {
    if (conn && conn.open) conn.send(data);
  }

  // 10. 루프 & 리사이즈
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
