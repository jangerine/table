<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile Tabletop Simulator - Yatzy Enhanced (4P)</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { margin: 0; overflow: hidden; touch-action: none; font-family: 'Pretendard', sans-serif; background-color: #0f172a; }

    /* Top Toolbar */
    #top-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 60px;
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
      z-index: 100; pointer-events: auto;
    }
    .btn-group-left, .btn-group-right { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }

    .ui-btn {
      padding: 7px 12px; font-size: 12px; font-weight: 700; color: white;
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s ease;
    }
    .ui-btn:active { transform: scale(0.95); }
    .ui-btn.active { outline: 2px solid #ffffff; box-shadow: 0 0 12px rgba(255,255,255,0.6); }

    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-teal { background: linear-gradient(135deg, #14b8a6, #0d9488); }
    .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-pink { background: linear-gradient(135deg, #ec4899, #db2777); }

    /* Pen/Eraser Tools Panel */
    #pen-tools-panel {
      position: absolute; top: 65px; left: 16px; z-index: 120;
      display: none; align-items: center; gap: 8px; padding: 6px 12px;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4); pointer-events: auto;
    }
    .color-dot {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.2s;
    }
    .color-dot.selected { border-color: #ffffff; transform: scale(1.25); }
    .size-btn {
      padding: 3px 8px; font-size: 11px; background: #334155; color: white;
      border: 1px solid #475569; border-radius: 6px; cursor: pointer;
    }
    .size-btn.selected { background: #3b82f6; border-color: #60a5fa; }
    
    /* Dynamic Action Bar */
    #dynamic-action-bar {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      z-index: 110; display: none; gap: 8px; padding: 6px 12px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: auto;
      flex-wrap: wrap; justify-content: center;
    }

    /* Bottom Info/Network Panel */
    #bottom-info {
      position: absolute; bottom: 16px; left: 16px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      padding: 10px 14px; color: #e2e8f0; font-size: 11px; line-height: 1.5;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 420px; pointer-events: auto;
    }
    #peer-ui { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #peer-ui input { width: 80px; padding: 4px 6px; font-size: 11px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; text-transform: uppercase; }
    #peer-ui button { padding: 4px 8px; font-size: 11px; border-radius: 6px; border: none; background: #10b981; color: white; font-weight: bold; }
    #player-seat-select { padding: 3px 6px; font-size: 11px; border-radius: 6px; background: #334155; color: white; border: 1px solid #475569; }

    /* Chat System */
    #chat-container {
      position: absolute; bottom: 16px; right: 16px; z-index: 150;
      width: 260px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden;
      display: flex; flex-direction: column; pointer-events: auto;
      transition: all 0.3s ease;
    }
    #chat-header {
      padding: 8px 12px; background: rgba(30, 41, 59, 0.8);
      font-size: 12px; font-weight: bold; color: #f8fafc;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    #chat-body { display: flex; flex-direction: column; height: 180px; transition: height 0.3s ease; }
    #chat-messages {
      flex: 1; padding: 8px 10px; overflow-y: auto; font-size: 11px;
      display: flex; flex-direction: column; gap: 6px; color: #e2e8f0;
      user-select: text; -webkit-user-select: text;
    }
    .chat-msg { line-height: 1.3; word-break: break-all; }
    .chat-msg .sender { font-weight: bold; color: #38bdf8; margin-right: 4px; }
    .chat-msg.me .sender { color: #10b981; }
    .chat-msg.system { color: #94a3b8; font-style: italic; }
    #chat-input-box { display: flex; padding: 6px; border-top: 1px solid rgba(255, 255, 255, 0.1); background: #0f172a; }
    #chat-input {
      flex: 1; padding: 6px 8px; font-size: 11px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: white; outline: none;
      user-select: text; -webkit-user-select: text;
    }
    #chat-send-btn { margin-left: 4px; padding: 6px 10px; font-size: 11px; font-weight: bold; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }

    /* Prop Spawn Modal */
    #prop-modal {
      position: absolute; top: 70px; left: 16px; z-index: 200;
      background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px;
      display: none; flex-direction: column; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: auto;
    }
    #prop-modal button {
      padding: 8px 12px; font-size: 12px; font-weight: bold; color: white;
      background: #334155; border: 1px solid #475569; border-radius: 8px; text-align: left;
    }

    /* Selection Box */
    #select-box {
      position: absolute; border: 2px dashed #60a5fa; background: rgba(96, 165, 250, 0.2);
      pointer-events: none; display: none; z-index: 150;
    }

    /* Yatzy Score Modal Overlay */
    #yatzy-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 300; display: none; flex-direction: column; width: 340px;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px;
      padding: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); color: white; pointer-events: auto;
    }
    #yatzy-modal h3 { margin: 0 0 10px 0; font-size: 16px; text-align: center; color: #38bdf8; }
    .score-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; margin-bottom: 12px; }
    .score-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(30, 41, 59, 0.8); border-radius: 8px; font-size: 13px;
    }
    .score-row button {
      padding: 4px 10px; font-size: 11px; font-weight: bold; color: white;
      background: #10b981; border: none; border-radius: 6px; cursor: pointer;
    }
    .score-row button:disabled { background: #475569; cursor: not-allowed; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
  let mySeat = 3;
  const CARD_BASE_Y = 0.32;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(-15, 16, 0);

  function updateCameraPosition() {
    if (mySeat === 1) camera.position.set(0, 16, 15);
    else if (mySeat === 2) camera.position.set(0, 16, -15);
    else if (mySeat === 3) camera.position.set(-15, 16, 0);
    else if (mySeat === 4) camera.position.set(15, 16, 0);
  }
  updateCameraPosition();

  const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 4;
  controls.maxDistance = 35;
  controls.target.set(0, 0.2, 0);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  function createWoodTexture() {
    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#5c3a21'; ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = '#4a2e19';
    for (let i = 0; i < 50; i++) ctx.fillRect(0, i * 10, 512, 3 + Math.random() * 2);
    return new THREE.CanvasTexture(canvas);
  }

  function createFeltMatTexture4P() {
    const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 2048;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1b4d2e'; ctx.fillRect(0, 0, 2048, 2048);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 12; ctx.strokeRect(30, 30, 1988, 1988);

    ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';

    ctx.strokeStyle = 'rgba(96, 165, 250, 0.6)'; ctx.lineWidth = 6;
    ctx.strokeRect(360, 1720, 1328, 260);
    ctx.fillStyle = 'rgba(96, 165, 250, 0.8)';
    ctx.fillText('P1 HAND ZONE (남)', 1024, 1860);

    ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
    ctx.strokeRect(360, 68, 1328, 260);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
    ctx.fillText('P2 HAND ZONE (북)', 1024, 210);

    ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
    ctx.strokeRect(68, 360, 260, 1328);
    ctx.fillStyle = 'rgba(16, 185, 129, 0.8)';
    ctx.save(); ctx.translate(200, 1024); ctx.rotate(-Math.PI/2);
    ctx.fillText('P3 HAND ZONE (서)', 0, 0); ctx.restore();

    ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
    ctx.strokeRect(1720, 360, 260, 1328);
    ctx.fillStyle = 'rgba(245, 158, 11, 0.8)';
    ctx.save(); ctx.translate(1848, 1024); ctx.rotate(Math.PI/2);
    ctx.fillText('P4 HAND ZONE (동)', 0, 0); ctx.restore();

    return new THREE.CanvasTexture(canvas);
  }

  const tableShape = new THREE.Shape();
  const w = 11.0, h = 11.0, r = 1.8;
  tableShape.moveTo(-w + r, -h); tableShape.lineTo(w - r, -h);
  tableShape.lineTo(w, -h + r); tableShape.lineTo(w, h - r);
  tableShape.lineTo(w - r, h); tableShape.lineTo(-w + r, h);
  tableShape.lineTo(-w, h - r); tableShape.lineTo(-w, -h + r);
  tableShape.closePath();

  const tableGeo = new THREE.ExtrudeGeometry(tableShape, { depth: 0.35, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.15, bevelThickness: 0.15 });
  tableGeo.rotateX(Math.PI / 2);
  const tableMesh = new THREE.Mesh(tableGeo, new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.6 }));
  tableMesh.position.y = -0.15;
  scene.add(tableMesh);

  const matGeo = new THREE.PlaneGeometry(20.0, 20.0);

  function createTrumpCardTexture(suit, value) {
    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 384;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 384);
    ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 4; ctx.strokeRect(6, 6, 244, 372);

    const color = (suit === '♥' || suit === '♦') ? '#dc2626' : '#1e293b';
    ctx.fillStyle = color;

    function drawIndex(x, y) {
      ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(value, x, y);
      ctx.font = '26px sans-serif'; ctx.fillText(suit, x, y + 32);
    }

    drawIndex(28, 42);
    ctx.save(); ctx.translate(256 - 28, 384 - 42); ctx.rotate(Math.PI);
    drawIndex(0, 0); ctx.restore();

    ctx.font = '84px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(suit, 128, 192);

    const texture = new THREE.CanvasTexture(canvas);
    texture.center.set(0.5, 0.5);
    return texture;
  }

  function createCardBackTexture() {
    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 384;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#b22222'; ctx.fillRect(0, 0, 256, 384);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; ctx.strokeRect(8, 8, 240, 368);
    ctx.fillStyle = '#8b0000';
    for (let i = 0; i < 256; i += 16) {
      for (let j = 0; j < 384; j += 16) {
        if ((i + j) % 32 === 0) ctx.fillRect(i, j, 16, 16);
      }
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.center.set(0.5, 0.5);
    return texture;
  }

  const cardBackTexture = createCardBackTexture();

  function createDiceFaceTexture(number) {
    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 12; ctx.strokeRect(6, 6, 244, 244);
    ctx.fillStyle = (number === 1) ? '#dc2626' : '#0f172a';

    function drawDot(x, y, radius = 22) {
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
    }
    const c = 128, l = 68, r = 188, t = 68, b = 188;
    if (number === 1) drawDot(c, c, 34);
    else if (number === 2) { drawDot(l, t); drawDot(r, b); }
    else if (number === 3) { drawDot(l, t); drawDot(c, c); drawDot(r, b); }
    else if (number === 4) { drawDot(l, t); drawDot(r, t); drawDot(l, b); drawDot(r, b); }
    else if (number === 5) { drawDot(l, t); drawDot(r, t); drawDot(c, c); drawDot(l, b); drawDot(r, b); }
    else if (number === 6) { drawDot(l, t); drawDot(r, t); drawDot(l, c); drawDot(r, c); drawDot(l, b); drawDot(r, b); }

    return new THREE.CanvasTexture(canvas);
  }

    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('YATZY SCOREBOARD (4P)', 300, 50);

    const categories = [
      { name: "Aces (1)", key: "Aces" },

      { name: "Fours (4)", key: "Fours" },
      { name: "Fives (5)", key: "Fives" },

    ];

    ctx.lineWidth = 2; ctx.font = 'bold 16px sans-serif';
    ctx.beginPath(); ctx.moveTo(20, 75); ctx.lineTo(580, 75); ctx.stroke();
    
    // 세로 구분선 (카테고리, P1, P2, P3, P4)
    const colX = [200, 295, 390, 485, 580];
    colX.forEach(x => {
      ctx.beginPath(); ctx.moveTo(x, 75); ctx.lineTo(x, 740); ctx.stroke();
    });

    ctx.fillText("CATEGORY", 110, 98);
    ctx.fillText("P1", 247, 98);
    ctx.fillText("P2", 342, 98);
    ctx.fillText("P3", 437, 98);
    ctx.fillText("P4", 532, 98);

    let y = 108;
    for (let i = 0; i < categories.length; i++) {
      const cat = categories[i];

      ctx.textAlign = 'left';
      if (cat.key === "Subtotal" || cat.key === "Bonus" || cat.key === "Total") {

      }

  /* --- [추가] 컵 속에 들어있는 주사위 감지 및 컵 굴리기 기믹 --- */
  function getDiceInCup(cup) {
    const CUP_RADIUS = 1.1; // 컵 내부로 볼 반경 거리
    const diceList = objects.filter(o => o.userData.type === 'dice' && !o.userData.isKeep);
    return diceList.filter(d => {
      const dist = Math.hypot(d.position.x - cup.position.x, d.position.z - cup.position.z);
      return dist <= CUP_RADIUS;
    });
  }

  function shakeAndRollCup(cup, isLocal = true) {
    if (!cup || cup.userData.isShaking) return;

    const diceInCup = getDiceInCup(cup);
    if (diceInCup.length === 0) {
      if (isLocal) alert('컵 안에 주사위가 없습니다! 주사위를 컵 위나 안으로 옮겨주세요.');
      return;
    }

    const hasYatzyBoard = objects.some(o => o.userData.type === 'board');
    if (hasYatzyBoard && yatzyRollsLeft <= 0) {
      if (isLocal) alert('남은 굴리기 기회가 없습니다! 점수를 기록해 주세요.');
      return;
    }

    if (hasYatzyBoard && isLocal) {
      yatzyRollsLeft--;
      updateDynamicActionBar();
    }

    cup.userData.isShaking = true;
    const startPos = cup.position.clone();
    const startRot = cup.rotation.clone();
    let progress = 0;

    function animateCupShake() {
      progress += 0.05;

      if (progress < 0.6) {
        // 1단계: 컵을 들어올리고 뒤집으며 컵 안의 주사위가 흩어짐
        cup.position.y = 0.27 + Math.sin((progress / 0.6) * Math.PI) * 2.2;
        cup.rotation.z = Math.sin((progress / 0.6) * Math.PI) * Math.PI;
        cup.position.x = startPos.x + (Math.random() - 0.5) * 0.2;
        cup.position.z = startPos.z + (Math.random() - 0.5) * 0.2;

        // 주사위들을 컵 위치 근처에서 같이 흔듦
        diceInCup.forEach(dice => {
          dice.position.x = cup.position.x + (Math.random() - 0.5) * 0.4;
          dice.position.z = cup.position.z + (Math.random() - 0.5) * 0.4;
          dice.position.y = cup.position.y;
        });
      } else {
        // 2단계: 컵이 원래대로 내려옴
        const t = (progress - 0.6) / 0.4;
        cup.position.y = THREE.MathUtils.lerp(startPos.y + 2.2, startPos.y, t);
        cup.rotation.z = THREE.MathUtils.lerp(Math.PI, 0, t);
        cup.position.x = THREE.MathUtils.lerp(cup.position.x, startPos.x, t);
        cup.position.z = THREE.MathUtils.lerp(cup.position.z, startPos.z, t);
      }

      if (progress < 1) {
        requestAnimationFrame(animateCupShake);
      } else {
        cup.position.copy(startPos);
        cup.rotation.copy(startRot);
        cup.userData.isShaking = false;

        // 컵 안의 주사위들을 사방으로 바깥에 펼쳐 떨어트리며 굴림
        diceInCup.forEach((dice, idx) => {
          const angle = (idx / diceInCup.length) * Math.PI * 2;
          const targetX = startPos.x + Math.cos(angle) * (1.2 + Math.random() * 0.6);
          const targetZ = startPos.z + Math.sin(angle) * (1.2 + Math.random() * 0.6);

          dice.position.x = targetX;
          dice.position.z = targetZ;

          rollDice(dice, isLocal);
        });

        if (isLocal) {
          broadcastData({ type: 'cup_roll', cupId: cup.userData.id, rollsLeft: yatzyRollsLeft });
        }
      }
    }
    animateCupShake();
  }

  function isPositionInSeatZone(x, z, seat) {
    if (seat === 1) return z > 6.8 && x >= -6.8 && x <= 6.8;
    if (seat === 2) return z < -6.8 && x >= -6.8 && x <= 6.8;
    if (seat === 3) return x < -6.8 && z >= -6.8 && z <= 6.8;
    if (seat === 4) return x > 6.8 && z >= -6.8 && z <= 6.8;
    return false;
  }

  function getSeatFromPosition(x, z) {
    if (isPositionInSeatZone(x, z, mySeat)) return mySeat;
    if (isPositionInSeatZone(x, z, 1)) return 1;
    if (isPositionInSeatZone(x, z, 2)) return 2;
    if (isPositionInSeatZone(x, z, 3)) return 3;
    if (isPositionInSeatZone(x, z, 4)) return 4;
    return 0;
  }

  function alignCardRotationBySeat(card) {
    const seat = getSeatFromPosition(card.position.x, card.position.z);
    if (seat === 1 || seat === 0) card.rotation.y = 0;
    else if (seat === 2) card.rotation.y = Math.PI;
    else if (seat === 3) card.rotation.y = Math.PI / 2;
    else if (seat === 4) card.rotation.y = -Math.PI / 2;
  }

  function updateHandVisibility(card) {
    const isInsideMyZone = isPositionInSeatZone(card.position.x, card.position.z, mySeat);
    if (isInsideMyZone) {
      card.rotation.z = 0;
      card.userData.isFlipped = false;
    } else {
      const seat = getSeatFromPosition(card.position.x, card.position.z);
      if (seat !== 0) {
        card.rotation.z = Math.PI;
        card.userData.isFlipped = true;
      } else {
        card.rotation.z = card.userData.isFlipped ? Math.PI : 0;
      }
    }
  }

  function snapCardsToSlots(movedCards) {
    const SNAP_DISTANCE = 0.8;
    const cardsToSnap = Array.isArray(movedCards) ? movedCards : [movedCards];

    cardsToSnap.forEach((card, idx) => {
      card.userData.lastMovedTime = Date.now() + idx;
      
      const sortedSlots = [...cardSlots].sort((a, b) => {
        const distA = Math.hypot(card.position.x - a.position.x, card.position.z - a.position.z);
        const distB = Math.hypot(card.position.x - b.position.x, card.position.z - b.position.z);
        return distA - distB;
      });

      for (let slot of sortedSlots) {
        const dist = Math.hypot(card.position.x - slot.position.x, card.position.z - slot.position.z);
        if (dist < SNAP_DISTANCE) {
          let progress = 0;
          const startX = card.position.x, startZ = card.position.z;
          const targetX = slot.position.x, targetZ = slot.position.z;
          card.userData.isAnimating = true;

          function animateSnap() {
            progress += 0.2;
            card.position.x = THREE.MathUtils.lerp(startX, targetX, progress);
            card.position.z = THREE.MathUtils.lerp(startZ, targetZ, progress);

            if (progress < 1) {
              requestAnimationFrame(animateSnap);
            } else {
              card.position.x = targetX;
              card.position.z = targetZ;
              card.rotation.y = 0;
              card.userData.isAnimating = false;
              updateStacking();
              sendMoveData(card);
            }
          }
          animateSnap();
          return;
        }
      }
      sendMoveData(card);
    });

    updateStacking();
  }

  function updateStacking() {
    const cards = objects.filter(o => o.userData.type === 'card' && !o.userData.isAnimating);
    const LAYER_HEIGHT = 0.025;

    cards.sort((a, b) => (a.userData.lastMovedTime || 0) - (b.userData.lastMovedTime || 0));

    cards.forEach((card, index) => {
      let stackIndex = 0;
      for (let i = 0; i < index; i++) {
        const other = cards[i];
        if (Math.hypot(card.position.x - other.position.x, card.position.z - other.position.z) < 0.8) {
          stackIndex++;
        }
      }
      card.position.y = CARD_BASE_Y + stackIndex * LAYER_HEIGHT;
      card.renderOrder = stackIndex + 1;
      alignCardRotationBySeat(card);
      updateHandVisibility(card);
    });
  }

    const deckCards = objects.filter(o => o.userData.type === 'card' && Math.hypot(o.position.x, o.position.z) < 1.5);
    if (deckCards.length === 0) return;

    const startX = -((deckCards.length - 1) * 0.2) / 2;
    const now = Date.now();
    deckCards.forEach((card, i) => {
      card.userData.lastMovedTime = now + i;
      card.position.set(startX + i * 0.2, CARD_BASE_Y, 0);
      alignCardRotationBySeat(card);

  function cutDeck(isLocal = true) {
    const deckCards = objects.filter(o => o.userData.type === 'card' && Math.hypot(o.position.x, o.position.z) < 1.5);
    if (deckCards.length < 2) return;

    const input = prompt(`몇 장의 카드를 떼어내시겠습니까? (최대 ${deckCards.length - 1}장)`, '5');
    const cutCount = parseInt(input, 10);
    if (isNaN(cutCount) || cutCount < 1 || cutCount >= deckCards.length) return;

    deckCards.sort((a, b) => b.position.y - a.position.y);
    const cutCards = deckCards.slice(0, cutCount);

    const now = Date.now();
    cutCards.forEach((card, i) => {
      card.userData.lastMovedTime = now + i;
      card.position.set(1.8, CARD_BASE_Y, 0);
      alignCardRotationBySeat(card);
      sendMoveData(card);

    if (isLocal) broadcastData({ type: 'cut', cutCount: cutCount });

  function shuffleCards(isLocal = true) {
    const allCards = objects.filter(o => o.userData.type === 'card');
    const deckCards = allCards.filter(c => Math.hypot(c.position.x, c.position.z) < 1.5);
    if (deckCards.length === 0) return;

    for (let i = deckCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deckCards[i], deckCards[j]] = [deckCards[j], deckCards[i]];
    }

    const LAYER_HEIGHT = 0.025;
    const now = Date.now();

    deckCards.forEach((card, index) => {
      card.userData.isAnimating = true;
      card.userData.isFlipped = true;
      card.userData.lastMovedTime = now + index;

      const targetX = (Math.random() - 0.5) * 0.05;
      const targetZ = (Math.random() - 0.5) * 0.05;
      const targetY = CARD_BASE_Y + index * LAYER_HEIGHT;

      let progress = 0;
      const startX = card.position.x, startY = card.position.y, startZ = card.position.z;

      function animateShuffle() {
        progress += 0.08;
        card.position.x = THREE.MathUtils.lerp(startX, targetX, progress);
        card.position.z = THREE.MathUtils.lerp(startZ, targetZ, progress);
        card.position.y = THREE.MathUtils.lerp(startY, targetY, progress) + Math.sin(progress * Math.PI) * 1.5;
        card.rotation.z = THREE.MathUtils.lerp(card.rotation.z, Math.PI, progress);

        if (progress < 1) {
          requestAnimationFrame(animateShuffle);
        } else {
          card.position.set(targetX, targetY, targetZ);
          alignCardRotationBySeat(card);
          card.rotation.z = Math.PI;
          card.userData.isAnimating = false;
          updateStacking();
        }
      }
      animateShuffle();
    });

    if (isLocal) broadcastData({ type: 'shuffle' });
  }

  function getDiceValues() {

  function calculateYatzyScores(vals) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    let sum = 0;
    vals.forEach(v => { counts[v]++; sum += v; });

    const scoreMap = {};

    scoreMap["Aces"] = counts[1] * 1;
    scoreMap["Twos"] = counts[2] * 2;
    scoreMap["Threes"] = counts[3] * 3;
    scoreMap["Fours"] = counts[4] * 4;
    scoreMap["Fives"] = counts[5] * 5;
    scoreMap["Sixes"] = counts[6] * 6;
    scoreMap["Choice"] = sum;

    // 4 of a Kind
    scoreMap["4ofKind"] = counts.some(c => c >= 4) ? sum : 0;

    // Full House
    const has3 = counts.some(c => c === 3);
    const has2 = counts.some(c => c === 2);
    const has5 = counts.some(c => c === 5);
    scoreMap["FullHouse"] = ((has3 && has2) || has5) ? sum : 0;

    // Small Straight
    const unique = [...new Set(vals)].sort((a,b)=>a-b).join('');
    const isSStraight = /1234|2345|3456/.test(unique);
    scoreMap["SStraight"] = isSStraight ? 15 : 0;

    // Large Straight
    const isLStraight = /12345|23456/.test(unique);
    scoreMap["LStraight"] = isLStraight ? 30 : 0;

    // Yatzy
    scoreMap["Yatzy"] = counts.some(c => c === 5) ? 50 : 0;

    return scoreMap;
  }

  function createLineMesh(points, colorHex, radius) {
    if (!points || points.length < 2) return null;
    const curvePoints = points.map(p => new THREE.Vector3(p.x, 0.28, p.z));
    const curve = new THREE.CatmullRomCurve3(curvePoints);
    const geometry = new THREE.TubeGeometry(curve, Math.max(points.length * 2, 8), radius, 6, false);
    const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });
    const mesh = new THREE.Mesh(geometry, material);
    return mesh;
  }

  function addRenderedLine(points, colorHex, radius, customId = null) {

    mesh.userData = { id: id, points: points };
    scene.add(mesh);

    const lineObj = { id: id, mesh: mesh, points: points };
    drawnLines.push(lineObj);
    return lineObj;
  }

  function checkEraserAtPoint(touchVec) {
    raycaster.setFromCamera(touchVec, camera);

    const hitPoint = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(boardPlane, hitPoint)) {
      eraserCursorMesh.position.set(hitPoint.x, 0.29, hitPoint.z);

      const ERASER_RADIUS = 0.8;

      let checkPoints = [hitPoint.clone()];
      if (lastEraserPoint) {
        const dist = hitPoint.distanceTo(lastEraserPoint);
        const steps = Math.ceil(dist / 0.15);
        for (let s = 1; s <= steps; s++) {
          checkPoints.push(new THREE.Vector3().lerpVectors(lastEraserPoint, hitPoint, s / steps));
        }
      }
      lastEraserPoint = hitPoint.clone();

      for (let i = drawnLines.length - 1; i >= 0; i--) {
        const line = drawnLines[i];
        
        const isTouched = line.points.some(pt => {
          return checkPoints.some(cPt => Math.hypot(pt.x - cPt.x, pt.z - cPt.z) < ERASER_RADIUS);
        });

        if (isTouched) {
          deleteSingleLine(line.id, true);
        }
      }
    }
  }

  function onTouchStart(e) {
    if (e.target.closest('#top-bar, #bottom-info, #prop-modal, #dynamic-action-bar, #chat-container, #pen-tools-panel, #yatzy-modal, #muffin-panel')) return;

    if (isCamModeAlwaysOn || (e.touches && e.touches.length > 1)) {
      selectedObj = null; controls.enabled = true; return;
    }

    const pos = getTouchPos(e);
    touch.x = pos.x; touch.y = pos.y;
    touchStartTime = Date.now();
    touchStartPos = { x: pos.rawX, y: pos.rawY };

    if (isEraserMode) {
      controls.enabled = false;
      lastEraserPoint = null;
      checkEraserAtPoint(touch);
      return;
    }

    if (isPenMode) {
      controls.enabled = false;
      raycaster.setFromCamera(touch, camera);
      const hitPoint = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(boardPlane, hitPoint)) {
        currentLinePoints = [{ x: hitPoint.x, z: hitPoint.z }];
        currentLineMesh = createLineMesh([{ x: hitPoint.x, z: hitPoint.z }, { x: hitPoint.x + 0.001, z: hitPoint.z + 0.001 }], selectedPenColor, selectedPenRadius);
        if (currentLineMesh) scene.add(currentLineMesh);
      }
      return;
    }

    if (isSelectMode) {
      isBoxSelecting = true;
      controls.enabled = false;
      selectBox.style.left = pos.rawX + 'px';
      selectBox.style.top = pos.rawY + 'px';
      selectBox.style.width = '0px';
      selectBox.style.height = '0px';
      selectBox.style.display = 'block';
      return;
    }

    raycaster.setFromCamera(touch, camera);
    const intersects = raycaster.intersectObjects(objects, true);

    if (intersects.length > 0) {
      let hitObj = intersects[0].object;
      while (hitObj.parent && hitObj.parent.type === 'Group') {
        hitObj = hitObj.parent;
      }

      if (hitObj.userData.isLocked) { controls.enabled = true; return; }

      selectedObj = hitObj;
      selectedObj.userData.lastMovedTime = Date.now();

      if (selectedGroup.includes(selectedObj)) {
        groupDragOffsets = selectedGroup.map(obj => ({
          obj: obj,
          offsetX: obj.position.x - selectedObj.position.x,
          offsetZ: obj.position.z - selectedObj.position.z
        }));
      } else {
        clearSelectionGroup();
        groupDragOffsets = [{ obj: selectedObj, offsetX: 0, offsetZ: 0 }];
      }
      controls.enabled = false;
    } else {
      clearSelectionGroup();
      selectedObj = null;
      controls.enabled = true;
    }
  }

  function onTouchMove(e) {
    if (e.target.closest('#top-bar, #bottom-info, #prop-modal, #dynamic-action-bar, #chat-container, #pen-tools-panel, #yatzy-modal, #muffin-panel')) return;

    const pos = getTouchPos(e);

    if (isEraserMode) {
      touch.x = pos.x; touch.y = pos.y;
      checkEraserAtPoint(touch);
      return;
    }

    if (isPenMode && currentLineMesh) {
      touch.x = pos.x; touch.y = pos.y;
      raycaster.setFromCamera(touch, camera);
      const hitPoint = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(boardPlane, hitPoint)) {
        const lastPt = currentLinePoints[currentLinePoints.length - 1];
        if (Math.hypot(hitPoint.x - lastPt.x, hitPoint.z - lastPt.z) > 0.08) {
          currentLinePoints.push({ x: hitPoint.x, z: hitPoint.z });
          scene.remove(currentLineMesh);
          currentLineMesh = createLineMesh(currentLinePoints, selectedPenColor, selectedPenRadius);
          if (currentLineMesh) scene.add(currentLineMesh);
        }
      }
      return;
    }

    if (isBoxSelecting) {
      const left = Math.min(touchStartPos.x, pos.rawX);
      const top = Math.min(touchStartPos.y, pos.rawY);
      const width = Math.abs(pos.rawX - touchStartPos.x);
      const height = Math.abs(pos.rawY - touchStartPos.y);

      selectBox.style.left = left + 'px';
      selectBox.style.top = top + 'px';
      selectBox.style.width = width + 'px';
      selectBox.style.height = height + 'px';
      return;
    }

    if (!selectedObj || selectedObj.userData.isLocked) return;

    touch.x = pos.x; touch.y = pos.y;
    raycaster.setFromCamera(touch, camera);
    const target = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, target);

    groupDragOffsets.forEach(item => {
      item.obj.position.x = target.x + item.offsetX;
      item.obj.position.z = target.z + item.offsetZ;

      if (item.obj.userData.type === 'card') {
        alignCardRotationBySeat(item.obj);
        updateHandVisibility(item.obj);
      }
      sendMoveData(item.obj);
    });

    updateStacking();
  }

  function toggleDiceKeep(dice, isLocal = true) {
    const hasYatzyBoard = objects.some(o => o.userData.type === 'board');
    if (!hasYatzyBoard) return;

    dice.userData.isKeep = !dice.userData.isKeep;
    if (dice.userData.isKeep) {
      const keepOutline = new THREE.Mesh(
        new THREE.BoxGeometry(0.76, 0.76, 0.76),
        new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true })
      );
      dice.add(keepOutline);
      dice.userData.keepMesh = keepOutline;
    } else {
      if (dice.userData.keepMesh) {
        dice.remove(dice.userData.keepMesh);
        dice.userData.keepMesh = null;
      }
    }

    if (isLocal) broadcastData({ type: 'toggle_keep', id: dice.userData.id, isKeep: dice.userData.isKeep });
  }

  function onTouchEnd(e) {
    const pos = getTouchPos(e);

    if (isEraserMode) {
      lastEraserPoint = null;
      controls.enabled = true;
      return;
    }

    if (isPenMode && currentLineMesh) {
      scene.remove(currentLineMesh);
      if (currentLinePoints.length >= 2) {
        const lineObj = addRenderedLine(currentLinePoints, selectedPenColor, selectedPenRadius);
        if (lineObj) {
          broadcastData({
            type: 'draw_line',
            id: lineObj.id,
            points: currentLinePoints,
            color: selectedPenColor,
            radius: selectedPenRadius
          });
        }
      }
      currentLineMesh = null;
      currentLinePoints = [];
      controls.enabled = true;
      return;
    }

    if (isBoxSelecting) {
      isBoxSelecting = false;
      selectBox.style.display = 'none';
      controls.enabled = true;
      clearSelectionGroup();

      const minX = Math.min(touchStartPos.x, pos.rawX);
      const maxX = Math.max(touchStartPos.x, pos.rawX);
      const minY = Math.min(touchStartPos.y, pos.rawY);
      const maxY = Math.max(touchStartPos.y, pos.rawY);

      objects.forEach(obj => {
        const screenPos = obj.position.clone().project(camera);
        const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

        if (x >= minX && x <= maxX && y >= minY && y <= maxY) {
          selectedGroup.push(obj);
          const outlineMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.0, 0.04, 1.4),
            new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true })
          );
          obj.add(outlineMesh);
          obj.userData.outlineMesh = outlineMesh;
        }
      });
      return;
    }

    if (selectedObj && !selectedObj.userData.isLocked) {
      const touchDuration = Date.now() - touchStartTime;
      const lastPos = e.changedTouches ? e.changedTouches[0] : e;
      const dist = Math.hypot(lastPos.clientX - touchStartPos.x, lastPos.clientY - touchStartPos.y);

      if (selectedObj.userData.type === 'muffin_card') {
        if (muffin3DPlayAtCenter(selectedObj)) { selectedObj=null; controls.enabled=true; return; }
        // 머핀 타임 카드는 테이블 위에서 실제 카드처럼 이동만 유지합니다.
      } else if (selectedObj.userData.type === 'muffin_deck') {
        if (touchDuration < 300 && dist < 10) { muffin3DDeckTap(selectedObj); selectedObj=null; controls.enabled=true; return; }
      } else if (selectedGroup.length > 0) {
        snapCardsToSlots(selectedGroup.filter(o => o.userData.type === 'card'));
      } else if (selectedObj.userData.type === 'card') {
        snapCardsToSlots(selectedObj);
      }

      if (touchDuration < 300 && dist < 10) {
        if (selectedObj.userData.type === 'muffin_card') { /* physical Muffin card */ }
        else if (selectedObj.userData.type === 'card') flipCard(selectedObj, true);
        else if (selectedObj.userData.type === 'cup') {
          shakeAndRollCup(selectedObj, true);
        } else if (selectedObj.userData.type === 'dice') {
          const hasYatzyBoard = objects.some(o => o.userData.type === 'board');
          if (hasYatzyBoard) {
            toggleDiceKeep(selectedObj, true);
          } else {
            rollDice(selectedObj, true);
          }
        }
      }

      updateStacking();
    }
    selectedObj = null;
    controls.enabled = true;
  }

  function getTouchPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX / window.innerWidth) * 2 - 1, y: -(t.clientY / window.innerHeight) * 2 + 1, rawX: t.clientX, rawY: t.clientY };
  }

  window.addEventListener('touchstart', onTouchStart, { passive: false });
  window.addEventListener('touchmove', onTouchMove, { passive: false });
  window.addEventListener('touchend', onTouchEnd, false);
  window.addEventListener('mousedown', onTouchStart, false);
  window.addEventListener('mousemove', onTouchMove, false);
  window.addEventListener('mouseup', onTouchEnd, false);

  function sendMoveData(obj) {
    const isInsideMyZone = isPositionInSeatZone(obj.position.x, obj.position.z, mySeat);
    let isFlippedForOthers = obj.userData.isFlipped;
    
    if (obj.userData.type === 'card') {
      if (isInsideMyZone) {
        isFlippedForOthers = true;
      } else {
        const seat = getSeatFromPosition(obj.position.x, obj.position.z);
        if (seat !== 0 && seat !== mySeat) isFlippedForOthers = true;
      }
    }

    broadcastData({ 
      type: 'move', id: obj.userData.id, 
      x: obj.position.x, z: obj.position.z, 
      rotY: obj.rotation.y, isFlipped: isFlippedForOthers 
    });
  }

  function flipCard(card, isLocal = false) {
    if (card.userData.isAnimating) return;
    card.userData.isAnimating = true;

    const targetRotZ = card.userData.isFlipped ? 0 : Math.PI;
    const startRotZ = card.rotation.z;
    let progress = 0;

    function animateFlip() {
      progress += 0.1;
      card.rotation.z = THREE.MathUtils.lerp(startRotZ, targetRotZ, progress);
      card.position.y = CARD_BASE_Y + Math.sin(progress * Math.PI) * 0.5;

      if (progress < 1) requestAnimationFrame(animateFlip);
      else {
        card.rotation.z = targetRotZ;
        card.userData.isFlipped = !card.userData.isFlipped;
        card.userData.isAnimating = false;
        updateStacking();
        sendMoveData(card);
      }
    }
    animateFlip();
    if (isLocal) broadcastData({ type: 'flip', id: card.userData.id });
  }

  const diceFaceRotations = {
    1: { x: 0, y: 0, z: 0 },
    6: { x: 0, y: Math.PI, z: 0 },
    2: { x: 0, y: -Math.PI / 2, z: 0 },
    5: { x: 0, y: Math.PI / 2, z: 0 },
    3: { x: -Math.PI / 2, y: 0, z: 0 },
    4: { x: Math.PI / 2, y: 0, z: 0 }
  };

  function rollDice(dice, isLocal = false, targetRot = null, targetValue = null) {
    if (dice.userData.isRolling) return;
    dice.userData.isRolling = true;

    const finalVal = targetValue || (Math.floor(Math.random() * 6) + 1);
    dice.userData.value = finalVal;

    const baseRot = diceFaceRotations[finalVal];
    const extraRotX = (Math.floor(Math.random() * 3) + 2) * Math.PI * 2;
    const extraRotY = (Math.floor(Math.random() * 3) + 2) * Math.PI * 2;

    const rotX = targetRot ? targetRot.x : baseRot.x + extraRotX;
    const rotY = targetRot ? targetRot.y : baseRot.y + extraRotY;
    const rotZ = targetRot ? targetRot.z : baseRot.z;

    const startRot = { x: dice.rotation.x, y: dice.rotation.y, z: dice.rotation.z };
    let progress = 0;

    function animateRoll() {
      progress += 0.04;
      dice.rotation.x = THREE.MathUtils.lerp(startRot.x, rotX, progress);
      dice.rotation.y = THREE.MathUtils.lerp(startRot.y, rotY, progress);
      dice.rotation.z = THREE.MathUtils.lerp(startRot.z, rotZ, progress);
      dice.position.y = 0.61 + Math.abs(Math.sin(progress * Math.PI * 2)) * (1 - progress) * 2;

      if (progress < 1) requestAnimationFrame(animateRoll);
      else {
        dice.position.y = 0.61;
        dice.userData.isRolling = false;
      }
    }
    animateRoll();
    if (isLocal) broadcastData({ type: 'roll', id: dice.userData.id, targetRot: { x: rotX, y: rotY, z: rotZ }, targetValue: finalVal });
  }

  function generateShortId() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    for (let i = 0; i < 4; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
    return result;
  }

  const shortId = generateShortId();
  const peer = new Peer(shortId);
  const connections = [];

  peer.on('open', id => document.getElementById('my-id').innerText = id);
  peer.on('connection', conn => {
    connections.push(conn);
    setupConnection(conn);
    addChatMessage('시스템', '새 플레이어가 접속했습니다.', false, true);
  });

  document.getElementById('connect-btn').addEventListener('click', () => {
    const targetId = document.getElementById('join-id').value.toUpperCase().trim();
    if (targetId) {
      const conn = peer.connect(targetId);
      connections.push(conn);
      setupConnection(conn);
    }
  });

  function setupConnection(conn) {
    document.getElementById('status').innerText = `(${connections.length}명 연결됨)`;
    document.getElementById('status').style.color = '#10b981';

    conn.on('data', data => handleNetworkData(data));
    conn.on('close', () => {
      const idx = connections.indexOf(conn);
      if (idx !== -1) connections.splice(idx, 1);
      document.getElementById('status').innerText = connections.length > 0 ? `(${connections.length}명 연결됨)` : '(대기중)';
      addChatMessage('시스템', '플레이어 한 명이 퇴장했습니다.', false, true);
    });
  }

  function broadcastData(data) {
    connections.forEach(conn => { if (conn.open) conn.send(data); });
  }

  function handleNetworkData(data) {
    if (data.type === 'chat') {
      addChatMessage(data.sender, data.text, false);
    } else if (data.type === 'draw_line') {
      addRenderedLine(data.points, data.color, data.radius, data.id);
    } else if (data.type === 'delete_line') {
      deleteSingleLine(data.id, false);
    } else if (data.type === 'clear_lines') {
      clearAllLines(false);
    } else if (data.type === 'clear') {
      objects.forEach(obj => scene.remove(obj));
      cardSlots.forEach(slot => scene.remove(slot));
      objects = []; cardSlots = [];
      clearSelectionGroup();
      resetYatzyScoreBoard();
      updateDynamicActionBar();
    } else if (data.type === 'create_slots') {
      createSlotLine(data.count, false);
    } else if (data.type === 'reset_deck') {
      spawnFullDeck(false);
    } else if (data.type === 'setup_yatzy') {
      setupYatzySet(false);
    } else if (data.type === 'roll_yatzy_all') {
      yatzyRollsLeft = data.rollsLeft;
      rollYatzyDice(false);
    } else if (data.type === 'cup_roll') {
      yatzyRollsLeft = data.rollsLeft !== undefined ? data.rollsLeft : yatzyRollsLeft;
      const cupObj = objects.find(o => o.userData.id === data.cupId);
      if (cupObj) shakeAndRollCup(cupObj, false);
    } else if (data.type === 'toggle_keep') {
      const diceObj = objects.find(o => o.userData.id === data.id);
      if (diceObj) {
        diceObj.userData.isKeep = data.isKeep;
        if (data.isKeep && !diceObj.userData.keepMesh) {
          const keepOutline = new THREE.Mesh(
            new THREE.BoxGeometry(0.76, 0.76, 0.76),
            new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true })
          );
          diceObj.add(keepOutline);
          diceObj.userData.keepMesh = keepOutline;
        } else if (!data.isKeep && diceObj.userData.keepMesh) {
          diceObj.remove(diceObj.userData.keepMesh);
          diceObj.userData.keepMesh = null;
        }
      }
    } else if (data.type === 'record_score') {
      recordYatzyScore(data.playerKey, data.category, data.score, false);
    } else if (data.type === 'spawn') {
      if (data.propType === 'card') createCard(data.x, data.z, false, data.suit, data.value, data.id);
      else if (data.propType === 'dice') createDice(data.x, data.z, false, data.id);
      else if (data.propType === 'cup') createDiceCup(data.x, data.z, false, data.id);
      else if (data.propType === 'yatzy_board') createYatzyBoard(data.x, data.z, false, data.id);
    } else if (data.type === 'shuffle') {
      shuffleCards(false);
    } else if (data.type === 'gather') {
      gatherCards(false);
    } else if (data.type === 'spread') {
      spreadCards(false);
    } else if (data.type === 'cut') {
      cutDeck(false);
    } else {
      const targetObj = objects.find(o => o.userData.id === data.id);
      if (!targetObj) return;
      if (data.type === 'move') {
        targetObj.position.x = data.x;
        targetObj.position.z = data.z;
        if (data.rotY !== undefined) targetObj.rotation.y = data.rotY;
        if (targetObj.userData.type === 'card' && data.isFlipped !== undefined) {
          targetObj.userData.isFlipped = data.isFlipped;
          updateHandVisibility(targetObj);
        }
        updateStacking();
      } else if (data.type === 'flip') flipCard(targetObj, false);
      else if (data.type === 'roll') rollDice(targetObj, false, data.targetRot, data.targetValue);
    }
  }

  function mpApplySnapshot(st){if(!st)return;Object.assign(MP,{mode:st.mode||'official',pack:st.pack||'all',turn:st.turn||1,direction:st.direction||1,goal:st.goal||10,deck:st.deck||[],discard:st.discard||[],players:st.players||MP.players,lastAction:st.lastAction||null,currentAction:st.currentAction||null,pending:st.pending||null,started:!!st.started});mpRender()}
  function mpBroadcast(payload){broadcastData(Object.assign({type:'muffin'},payload))}
  function mpSync(){mpBroadcast({op:'state',state:mpSnapshot()})}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function mpBuildDeck(){
    const d=[];
    const push=(arr,type)=>arr.forEach(n=>d.push(mpCard(n,type)));
    push(MP.actionNames,'action');push(MP.trapNames,'trap');push(MP.counterNames,'counter');
    // 230-card library = base + Kickstarter + two expansion packs represented by the full library.
    return shuffle(d);
  }
  function mpResetState(){if(MP.pendingTimer){clearTimeout(MP.pendingTimer);MP.pendingTimer=null}MP.deck=mpBuildDeck();MP.discard=[];MP.turn=1;MP.direction=1;MP.goal=10;MP.lastAction=null;MP.currentAction=null;MP.pending=null;MP.winCandidate=null;MP.started=true;MP.players.forEach(p=>{p.hand=[];p.traps=[];p.skipped=false})}
  function recycle(){if(!MP.deck.length&&MP.discard.length){MP.deck=shuffle(MP.discard.splice(0));MP.deck.forEach(c=>{c.owner=0;c.faceUp=false})}}
  function mpDraw(seat,n=1){const p=MP.players[seat-1];for(let i=0;i<n;i++){recycle();if(!MP.deck.length)break;const c=MP.deck.pop();c.owner=seat;c.faceUp=false;p.hand.push(c)}mpCheckMuffin(seat);mpRender()}
  function mpDiscardCards(p,count){let n=Math.min(Math.max(0,count),p.hand.length);for(let i=0;i<n;i++)MP.discard.push(p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0]);return n}
  function mpTakeRandom(from,to,count=1){const a=MP.players[from-1],b=MP.players[to-1];for(let i=0;i<count&&a.hand.length;i++){const c=a.hand.splice(Math.floor(Math.random()*a.hand.length),1)[0];c.owner=to;b.hand.push(c)}mpCheckMuffin(to)}
  function mpGiveRandom(from,to,count=1){mpTakeRandom(from,to,count)}
  function mpChooseTarget(cb,label='대상 선택'){const box=document.getElementById('muffin-targets');box.innerHTML='<b style="grid-column:1/-1">'+label+'</b>';MP.players.forEach(p=>{if(p.seat===mySeat)return;const b=document.createElement('button');b.className='mtarget';b.textContent='P'+p.seat+' · '+p.hand.length+'장';b.onclick=()=>{box.innerHTML='';cb(p.seat)}})}
  function mpChooseCardFromHand(seat,cb,filter=()=>true){const p=MP.players[seat-1];const opts=p.hand.filter(filter);if(!opts.length){alert('조건에 맞는 카드가 없습니다.');return}const list=opts.map((c,i)=>(i+1)+'. '+c.name).join('\n');const k=parseInt(prompt('카드 선택:\n'+list,'1'))-1;if(k>=0&&k<opts.length)cb(opts[k])}
  function mpMoveCard(card,from,to){const i=from.hand.indexOf(card);if(i>=0)from.hand.splice(i,1);card.owner=to.seat;to.hand.push(card)}
  function mpNextTurn(){if(MP.mode==='free')return;let tries=0;do{MP.turn=((MP.turn-1+MP.direction+8)%8)+1;tries++}while(MP.players[MP.turn-1].skipped&&tries<9);MP.players[MP.turn-1].skipped=false;mpBroadcast({op:'turn',turn:MP.turn});mpCheckMuffin(MP.turn)}
  function isMini(name){return ['JOUST TIME','LIE TO ME','SHOWDOWN','MYSTERY BUTTON','CAN\'T BREATHE','BABY VOICE','ALPHABET','OH NO!','CAN YOU DO THIS?','STANDING UP SCHOOL','OKAY, DRAW!','NEW CAMERA','TAKE IT OUTSIDE'].includes(name.toUpperCase())}
  function manual(name,seat){mpLog('🟨 '+name+' — 실제 말하기/행동/신체조건이 필요한 카드입니다. 테이블에서 조건을 실행한 뒤 해당 카드의 "효과 적용"을 눌러주세요.');alert(name+'\n\n실제 행동이 필요한 카드입니다. 참가자들이 조건을 수행한 뒤 효과를 수동으로 적용하세요.');}
  function desc(name,type){
    const n=name.toUpperCase();
    if(type==='counter')return '현재 진행 중인 효과에 반응하는 카운터';
    if(type==='trap')return '조건이 발생하면 공개·발동하는 함정';
    const m={
      'MUFFIN TIME':'5장 뽑기','MAGICAL PONY':'4장 뽑기','LEVEL UP':'나 2장, 다른 모든 플레이어 1장 뽑기','DO THE FLOP!':'모두 1장 버리기','MINE TURTLE':'모두 3장 버리기','MY LEMONS':'내 카드 4장 버리기','I WANNA DIE':'내 패 전부 버리기','ONLY ONE':'모두 1장만 남기기','YOU\'RE FAT':'대상 5장 뽑기','BARBERSHOP QUARTET':'대상에게서 4장 훔치거나 내가 4장 뽑기','GOT YOUR NOSE':'대상 1장 훔치기','PULL MY FINGER':'대상 1장 훔치기','STOLEN FACE':'대상 2장 훔치기','YAY! COOKIES!':'모두에게서 1장씩 훔치기','YOU\'RE ADOPTED':'버림더미 위 3장 회수','HOMEWORK':'덱 위 5장 중 1장 선택','MAGIC TRICK':'덱에서 원하는 카드 검색','TIME OF DEATH':'승리 목표를 1~20으로 변경','PARALLEL UNIVERSE':'내 패 수만큼 뽑기','GROW UP FAST':'모두 7장으로 맞추기','I SUCK AT THIS GAME':'최저 손패 플레이어 3장 뽑기','WHAT ARE YOU DOING?!':'모든 손패를 섞어 균등 재분배','HOLD THIS':'대상과 손패 교환','ALIEN INVASION':'내 손패 전부 대상에게 주기','MINE NOW':'상대 함정 1장 가져오기','CANNONBALL':'각자 함정 1장 버리기','PUNCH EM':'대상 함정 전부 버리기','SHOOT YOUR PROBLEMS':'모든 함정 버리기','SUDDENLY PINEAPPLES':'모든 설치 함정 버리기','FALLING UP':'턴 방향 반전','KILLED US ALL':'나 2장, 나머지 1장씩 버리기','THROW THE CHEESE':'나를 제외한 모두 1장 버리기','NEW YOU':'내 패 전부 버리고 같은 수만큼 다시 뽑기','POINTLESS':'아무 일도 없음','FAMILY':'수동 효과'};return m[n]||'카드 효과를 실행';
  }
  function removeTrap(p,c){const i=p.traps.indexOf(c);if(i>=0){p.traps.splice(i,1);c.owner=0;MP.discard.push(c);return true}return false}
  function chooseTrap(seat,cb,fromAll=false){const pools=fromAll?MP.players.flatMap(p=>p.traps.map(c=>({p,c}))):MP.players[seat-1].traps.map(c=>({p:MP.players[seat-1],c}));if(!pools.length){alert('설치된 함정이 없습니다.');return}const list=pools.map((x,i)=>(i+1)+'. P'+x.p.seat+' '+x.c.name).join('\n');const k=parseInt(prompt('함정 선택:\n'+list,'1'))-1;if(k>=0&&k<pools.length)cb(pools[k].p,pools[k].c)}

  // ----- counters / interrupt stack -----
  const counterRules={
    'NOT TODAY!':'cancel','NO!!!':'cancel_return','NOPE!':'cancel_steal','STOP IT!':'cancel_draw','DON\'T JUMP':'cancel_discard','DOG WITH A KNIFE':'cancel_trap','OUT OF MUFFINS':'cancel_muffin','SHOOT IT DOWN':'cancel_pony','AW, COME ON!':'cancel_punish','CAN\'T TELL ME':'cancel_draw1','NO ONE LIKES YOU':'remove_action','PUT IT BACK':'cancel_return','DEAD TO ME':'cancel_skip','CATCH THE KNIFE':'cancel_counter','EVIL BUTTERFLY':'cancel_counter','OPPOSITE DAY':'replace','BEEP BEEP I\'M A SHEEP':'affect_all','WANNABE':'share','WE FAILED':'share','STEGOSAURUS':'redirect','STATIC':'redirect_next','LOOK OUT':'cancel_steal','NO U':'reverse_steal','OH… OKAY?':'reverse_discard','MY FAVOURITE':'double_self','I\'M A GHOST':'cancel_and_traps','NEVER TAKE ME ALIVE':'cancel_skip','REALLY FAR AWAY':'cancel_trap','I CAN\'T READ':'immune','HERE THEY ARE':'recover2','TREE POWERS':'cancel_steal_skip','CHASE ME':'punish_stealer','THANKS, YOU TOO':'share_trap','MEOW MEOW I\'M A COW':'trap_all','CAN\'T FIRE ME':'discard_instead','ME! ME! ME!':'cancel_jump','THE HOLE':'wipe','NOT MY HAND!':'sacrifice','BABY WITH TWO GUNS':'counter_baby','BABY ON FIRE':'manual','BOMB SQUAD':'cancel_turtle'};
  function openCounterWindow(action,resolve){
    MP.pending={id:mpId(),card:action.card,seat:action.seat,kind:action.card.type,started:Date.now(),cancelled:false,resolved:false};
    MP.currentAction=action;mpSync();mpRender();
    if(MP.pendingTimer)clearTimeout(MP.pendingTimer);
    MP.pendingTimer=setTimeout(()=>{if(MP.pending&&!MP.pending.resolved){MP.pending.resolved=true;resolve();MP.pending=null;mpSync();mpRender()}},4500);
  }
  function mpPlayCounter(cardId){
    if(!MP.pending){alert('현재 대응할 효과가 없습니다.');return}
    const p=MP.players[mySeat-1],idx=p.hand.findIndex(c=>c.id===cardId);if(idx<0)return;const c=p.hand[idx];
    if(c.type!=='counter')return;
    p.hand.splice(idx,1);MP.discard.push(c);
    const rule=counterRules[c.name.toUpperCase()]||'cancel';
    if(rule==='manual'){manual(c.name,mySeat);return}
    const pend=MP.pending, target=pend.card.name.toUpperCase();
    let text='P'+mySeat+'가 '+c.name+'으로 반응';
    if(rule==='cancel'||rule==='cancel_return'||rule==='cancel_steal'||rule==='cancel_draw'||rule==='cancel_discard'||rule==='cancel_trap'||rule==='cancel_muffin'||rule==='cancel_pony'||rule==='cancel_punish'||rule==='cancel_draw1'||rule==='remove_action'||rule==='cancel_jump'||rule==='wipe'||rule==='counter_baby'||rule==='cancel_turtle'){pend.cancelled=true;pend.counter=c;}
    if(rule==='reverse_steal'&&pend.seat){mpChooseTarget(t=>{mpTakeRandom(pend.seat,t,1);mpLog(text);mpBroadcast({op:'counter',state:mpSnapshot()})})}
    if(rule==='redirect'){mpChooseTarget(t=>{pend.redirect=t;mpLog(text);mpBroadcast({op:'counter',state:mpSnapshot()})})}
    if(rule==='redirect_next'){pend.redirect=((pend.seat-1+MP.direction+8)%8)+1;mpLog(text);}
    if(rule==='double_self')pend.doubleSelf=true;
    if(rule==='share'||rule==='share_trap')pend.share=true;
    if(rule==='affect_all'||rule==='trap_all')pend.all=true;
    if(rule==='recover2'){for(let i=0;i<2&&MP.discard.length;i++){const x=MP.discard.pop();x.owner=mySeat;p.hand.push(x)}}
    if(rule==='cancel_steal_skip'||rule==='cancel_skip'){pend.cancelled=true;MP.players[pend.seat-1].skipped=true}
    if(rule==='cancel_and_traps'){pend.cancelled=true;MP.players[mySeat-1].traps.forEach(x=>MP.discard.push(x));MP.players[mySeat-1].traps=[]}
    if(rule==='cancel_counter'){pend.cancelled=true}
    if(rule==='cancel_return'&&pend.card){pend.returnTo=pend.seat}
    if(rule==='discard_instead')pend.discardInstead=mySeat;
    if(rule==='immune')pend.immune=mySeat;
    if(rule==='sacrifice'){mpChooseTarget(t=>{pend.sacrifice=t})}
    if(rule==='punish_stealer'){pend.punish=mySeat}
    if(rule==='share_trap'){pend.shareTrap=true}
    if(rule==='trap_all'){pend.all=true}
    mpLog(text+' · '+target);mpBroadcast({op:'counter',state:mpSnapshot()});mpRender();
  }

  function resolvePending(){const pnd=MP.pending;if(!pnd)return;const c=pnd.card;MP.pending=null;if(pnd.cancelled){if(pnd.returnTo){const q=MP.players[pnd.returnTo-1];c.owner=q.seat;q.hand.push(c)}mpLog('🛑 '+c.name+' 효과가 취소됨');return}executeAction(c,pnd.seat,pnd)}
  function executeAction(c,seat,pnd={}){
    const n=c.name.toUpperCase(),p=MP.players[seat-1];MP.lastAction=c;MP.currentAction=null;
    if(isMini(n)){runMiniGame(n,seat);return}
    const target=()=>new Promise(res=>mpChooseTarget(res));
    if(n==='MUFFIN TIME'){mpDraw(seat,5);return}
    if(n==='MAGICAL PONY'){mpDraw(seat,4);return}
    if(n==='LEVEL UP'){mpDraw(seat,2);MP.players.forEach(q=>{if(q.seat!==seat)mpDraw(q.seat,1)});return}
    if(n==='DO THE FLOP!'){MP.players.forEach(q=>mpDiscardCards(q,1));return}
    if(n==='MINE TURTLE'){MP.players.forEach(q=>mpDiscardCards(q,3));return}
    if(n==='MY LEMONS'){mpDiscardCards(p,4);return}
    if(n==='I WANNA DIE'){mpDiscardCards(p,p.hand.length);return}
    if(n==='ONLY ONE'){MP.players.forEach(q=>mpDiscardCards(q,Math.max(0,q.hand.length-1)));return}
    if(n==='YOU\'RE FAT'){mpChooseTarget(t=>{mpDraw(t,5);});return}
    if(n==='GOT YOUR NOSE'||n==='PULL MY FINGER'){mpChooseTarget(t=>mpTakeRandom(t,seat,1));return}
    if(n==='STOLEN FACE'){mpChooseTarget(t=>mpTakeRandom(t,seat,2));return}
    if(n==='YAY! COOKIES!'){MP.players.filter(q=>q.seat!==seat).forEach(q=>mpTakeRandom(q.seat,seat,1));return}
    if(n==='BARBERSHOP QUARTET'){mpChooseTarget(t=>{const mode=confirm('확인을 누르면 대상에게서 4장 훔칩니다.\n취소하면 덱에서 4장 뽑습니다.');if(mode)mpTakeRandom(t,seat,4);else mpDraw(seat,4)});return}
    if(n==='YOU\'RE ADOPTED'){for(let i=0;i<3&&MP.discard.length;i++){const x=MP.discard.pop();x.owner=seat;p.hand.push(x)}return}
    if(n==='HOMEWORK'){const top=MP.deck.slice(-5);const names=top.map((x,i)=>(i+1)+'. '+x.name).join('\n');const k=parseInt(prompt('상위 5장 중 선택:\n'+names,'1'))-1;if(k>=0&&k<top.length){const x=top[k],i=MP.deck.indexOf(x);MP.deck.splice(i,1);x.owner=seat;p.hand.push(x)}return}
    if(n==='MAGIC TRICK'){const q=prompt('찾을 카드 이름(영문):','MUFFIN TIME');const i=MP.deck.findIndex(x=>x.name.toUpperCase()===String(q).toUpperCase());if(i>=0){const x=MP.deck.splice(i,1)[0];x.owner=seat;p.hand.push(x)}else alert('덱에 없습니다.');return}
    if(n==='TIME OF DEATH'){const g=parseInt(prompt('승리 목표 1~20:',String(MP.goal)));if(g>=1&&g<=20)MP.goal=g;return}
    if(n==='PARALLEL UNIVERSE'){mpDraw(seat,p.hand.length);return}
    if(n==='GROW UP FAST'){MP.players.forEach(q=>{while(q.hand.length<7)mpDraw(q.seat,1);while(q.hand.length>7)mpDiscardCards(q,1)});return}
    if(n==='I SUCK AT THIS GAME'){const m=Math.min(...MP.players.map(q=>q.hand.length));MP.players.filter(q=>q.hand.length===m).forEach(q=>mpDraw(q.seat,3));return}
    if(n==='WHAT ARE YOU DOING?!'||n==='DRUNK SCIENCE'){const pool=MP.players.flatMap(q=>q.hand.splice(0));shuffle(pool);let i=0;while(pool.length){const q=MP.players[i++%8],x=pool.pop();x.owner=q.seat;q.hand.push(x)}return}
    if(n==='HOLD THIS'){mpChooseTarget(t=>{const q=MP.players[t-1];const a=p.hand,b=q.hand;p.hand=b;q.hand=a;p.hand.forEach(x=>x.owner=seat);q.hand.forEach(x=>x.owner=t);});return}
    if(n==='ALIEN INVASION'){mpChooseTarget(t=>{const q=MP.players[t-1];while(p.hand.length)mpMoveCard(p.hand.pop(),p,q)});return}
    if(n==='MINE NOW'){chooseTrap(seat,(q,x)=>{removeTrap(q,x);x.owner=seat;p.hand.push(x)} ,true);return}
    if(n==='PUNCH EM'){mpChooseTarget(t=>{const q=MP.players[t-1];q.traps.splice(0).forEach(x=>MP.discard.push(x))});return}
    if(n==='CANNONBALL'){MP.players.forEach(q=>{if(q.traps.length)removeTrap(q,q.traps[Math.floor(Math.random()*q.traps.length)])});return}
    if(n==='SHOOT YOUR PROBLEMS'){p.traps.splice(0).forEach(x=>MP.discard.push(x));return}
    if(n==='SUDDENLY PINEAPPLES'){MP.players.forEach(q=>q.traps.splice(0).forEach(x=>MP.discard.push(x)));return}
    if(n==='KILLED US ALL'){mpDiscardCards(p,2);MP.players.forEach(q=>{if(q.seat!==seat)mpDiscardCards(q,1)});return}
    if(n==='THROW THE CHEESE'){MP.players.forEach(q=>{if(q.seat!==seat)mpDiscardCards(q,1)});return}
    if(n==='NEW YOU'){const k=p.hand.length;mpDiscardCards(p,k);mpDraw(seat,k);return}
    if(n==='FALLING UP'){MP.direction*=-1;return}
    if(n==='I LIKE TRAINS'||n==='SKATEBOARDS'||n==='HERE IT COMES'){const prev=((seat-1-MP.direction+16)%8)+1;const q=MP.players[prev-1];const amt=q.hand.length;while(q.hand.length)mpMoveCard(q.hand[q.hand.length-1],q,p);return}
    if(n==='THE END'){alert('특수 승리 카드: 다음 내 턴 시작 시 손패가 가장 적은 플레이어가 승리합니다.');return}
    if(n==='ONE YEAR TO LIVE'){alert('특수 승리 카드: 다음 내 턴 시작 시 손패가 가장 많은 플레이어가 승리합니다.');return}
    if(n==='SHOOT ME'){p.winCandidate='nonempty';return}
    if(n==='DON\'T WANT TO BE FAT'||n==='DIE POTATO'){mpChooseTarget(t=>mpDiscardCards(MP.players[t-1],5));return}
    if(n==='YOU CAN WAIT'){mpChooseTarget(t=>{MP.players[t-1].skipped=true});return}
    if(n==='!TAKE EM OUT'){mpChooseTarget(t=>mpDiscardCards(MP.players[t-1],999));return}
    if(n==='PIECE OF ME'){mpChooseTarget(t=>{for(let i=0;i<2&&p.hand.length;i++){const x=p.hand.splice(Math.floor(Math.random()*p.hand.length),1)[0];x.owner=t;MP.players[t-1].hand.push(x)}});return}
    if(n==='WHOSE IDEA'){mpChooseTarget(t=>mpTakeRandom(t,seat,3));return}
    if(n==='YOU\'RE DEAD'){mpChooseTarget(t=>{const q=MP.players[t-1];q.hand=q.hand.filter(x=>{if(x.type==='counter'){MP.discard.push(x);return false}return true})});return}
    if(n==='WHO\'S THERE?'){chooseTrap(seat,(q,x)=>x.faceUp=true,true);return}
    if(n==='I SENTENCE YOU'){mpChooseTarget(t=>{if(confirm('확인: 다음 턴 건너뛰기\n취소: 카드 3장 버리기'))MP.players[t-1].skipped=true;else mpDiscardCards(MP.players[t-1],3)});return}
    if(n==='IN SYNC'&&MP.lastAction&&MP.lastAction.id!==c.id){executeAction(MP.lastAction,seat,{});return}
    if(n==='SCREW GRAVITY'){for(let i=0;i<3;i++){recycle();if(MP.deck.length){const x=MP.deck.shift();x.owner=seat;p.hand.push(x)}}return}
    if(n==='YOU\'RE ADOPTED')return;
    if(n==='MUFFIN FACTORY'){p.extraActions=(p.extraActions||0)+2;return}
    if(n==='QUICKFIRE'){MP.players.filter(q=>q.seat!==seat).forEach(q=>{while(q.hand.some(x=>x.type==='trap')&&q.traps.length<3){const x=q.hand.find(y=>y.type==='trap');q.hand.splice(q.hand.indexOf(x),1);q.traps.push(x)}});return}
    if(n==='LET YOU GO'){const k=parseInt(prompt('버릴 카드 수:', '1'));if(k>0)mpDiscardCards(p,k);return}
    if(n==='BANANA PEEL'){c.faceUp=true;MP.deck.unshift(c);shuffle(MP.deck);return}
    if(n==='HERE COMES THE AEROPLANE'||n==='I\'M ON MY WAY'){const next=((seat-1+MP.direction+8)%8)+1;const q=MP.players[next-1];c.owner=next;q.hand.push(c);return}
    if(n==='HEY, YOU TWO SHOULD KISS!'){mpDraw(seat,2);if(p.hand.length){mpChooseTarget(t=>{mpTakeRandom(seat,t,1)})}return}
    if(n==='BAD SPREAD'){if(MP.lastAction)executeAction(MP.lastAction,seat,{});return}
    if(n==='IMMA GETCHA'){mpChooseTarget(t=>{const q=MP.players[t-1];q.hand=q.hand.filter(x=>{if(x.type==='action'){MP.discard.push(x);return false}return true})});return}
    if(n==='DON\'T EVEN'){MP.noActionsUntil=MP.players[seat-1].seat;return}
    if(n==='HOLD YOUR HORSES'){MP.noWinUntil=seat;return}
    if(n==='FEED ME PAPER'){mpChooseTarget(t=>{mpDiscardCards(p,3);mpDiscardCards(MP.players[t-1],3)});return}
    if(n==='I\'M A DOCTOR'){mpDraw(seat,p.lastLost||0);p.lastLost=0;return}
    if(n==='HIT BY A CARD'){mpChooseTarget(t=>{mpDiscardCards(MP.players[t-1],999);mpDraw(seat,3)});return}
    if(n==='TIME MACHINE'){const i=MP.discard.map(x=>x.name).lastIndexOf(c.name);if(i>=0){const x=MP.discard.splice(i,1)[0];x.owner=seat;p.hand.push(x)}return}
    if(n==='PIE FLAVOUR'){const top=MP.discard.slice(-10);if(top.length){const list=top.map((x,i)=>(i+1)+'. '+x.name).join('\n');const k=parseInt(prompt('버림더미 상위 10장 중 선택:\n'+list,'1'))-1;if(k>=0&&k<top.length){const x=top[k],i=MP.discard.indexOf(x);MP.discard.splice(i,1);x.owner=seat;p.hand.push(x)}}return}
    if(n==='YOU\'RE A CHAIR'){MP.players.forEach(q=>{const opp=MP.players[((q.seat-1+4)%8)];q.traps.splice(0).forEach(x=>{x.owner=opp.seat;opp.traps.push(x)})});return}
    if(n==='IS THIS YOU?'){mpDraw(seat,3);mpChooseTarget(t=>mpDraw(t,3));return}
    if(n==='IS THIS YOURS?'){mpChooseTarget(t=>{const q=MP.players[t-1];q.traps.splice(0).forEach(x=>{x.owner=t;q.hand.push(x)})});return}
    if(n==='YOU\'RE BLIND'){mpChooseTarget(t=>{const q=MP.players[t-1];let x;do{recycle();x=MP.deck.pop();if(!x)break;if(x.type==='action'){x.owner=t;q.hand.push(x);executeAction(x,t,{});break}else MP.discard.push(x)}while(MP.deck.length)});return}
    if(n==='CONFESSION'){mpDraw(seat,3);alert('당신의 새 카드 3장을 다른 플레이어에게 공개하세요.');return}
    if(n==='BOUND TOGETHER'){const pool=[];MP.players.forEach(q=>{while(q.hand.length)pool.push(q.hand.pop())});shuffle(pool);let i=0;while(pool.length){const q=MP.players[i++%8],x=pool.pop();x.owner=q.seat;q.hand.push(x)}return}
    if(n==='IS THIS YOURS?')return;
    if(n==='TALL SHORTY'||n==='LITTLE BABY'||n==='JOHNNY BIG FEET'||n==='BIG BABY'||n==='CAT ALLERGY'||n==='NO DOG?!'||n==='COOL HAT'||n==='NICE HAT'||n==='SNAKE ARMS'||n==='JEWELLERY'||n==='YOU\'RE A NERD'||n==='MEDICATION TIME'||n==='DAY OF BIRTH'||n==='NO, LLAMA! NO!'||n==='PARKED CAR'||n==='WRONG HOUSE'||n==='GET OFF MY PROPERTY'||n==='RAINBOWS'||n==='I AM LONELY'||n==='I USED TO BE A COW'||n==='WHAT\'S THEIR NAME? '){manual(n,seat);return}
    manual(n,seat);
  }
  function runMiniGame(n,seat){
    if(n==='MYSTERY BUTTON'){const heads=Math.random()<.5;if(heads)mpDraw(seat,3);else mpDiscardCards(MP.players[seat-1],3);mpLog('🪙 MYSTERY BUTTON → '+(heads?'앞면: +3':'뒷면: -3'));return}
    mpLog('🎮 '+n+' 미니게임 시작 — 미니게임은 카운터할 수 없습니다. 참가자들이 실제로 겨룬 뒤 승자를 선택하세요.');
    mpChooseTarget(t=>{const winner=confirm('확인 = 선택한 상대가 승리 / 취소 = 나(P'+seat+')가 승리');const w=winner?t:seat;mpDraw(w,3);mpLog('🎮 '+n+' 승자 P'+w+' → +3장')},'미니게임 상대 선택');
  }
  function mpCheckMuffin(seat){const p=MP.players[seat-1];if(!MP.started||p.hand.length!==MP.goal)return;if(MP.noWinUntil===seat)return;if(!p.muffinAnnounced){p.muffinAnnounced=true;MP.winCandidate={seat,announcedAt:Date.now()};mpLog('🧁 P'+seat+'가 정확히 '+MP.goal+'장을 모아 "MUFFIN TIME!"을 선언했습니다. 다음 자기 턴 시작까지 유지해야 합니다.');mpBroadcast({op:'state',state:mpSnapshot()});}}
  function mpCheckStartWin(seat){const p=MP.players[seat-1];if(p.muffinAnnounced&&p.hand.length===MP.goal){alert('🧁 P'+seat+' 승리! MUFFIN TIME!');mpLog('🏆 P'+seat+' 승리');MP.started=false;return true}return false}
  function mpPlay(cardId){
    const p=MP.players[mySeat-1],idx=p.hand.findIndex(c=>c.id===cardId);if(idx<0)return;const c=p.hand[idx];
    if(!MP.started){alert('게임을 먼저 시작하세요.');return}
    if(c.type==='counter'){mpPlayCounter(cardId);return}
    if(MP.pending){alert('현재 다른 효과의 카운터 창입니다. 먼저 반응을 처리하세요.');return}
    if(MP.mode==='official'&&MP.turn!==mySeat){alert('현재 P'+MP.turn+'의 턴입니다.');return}
    if(MP.noActionsUntil===mySeat&&c.type==='action'){alert('행동 카드가 금지된 상태입니다.');return}
    p.hand.splice(idx,1);c.owner=0;
    if(c.type==='trap'){if(p.traps.length>=3){p.hand.splice(idx,0,c);alert('함정은 최대 3장입니다. 기존 함정을 하나 교체해야 합니다.');return}p.traps.push(c);c.faceUp=false;mpLog('🪤 P'+mySeat+' 함정 설치: '+c.name);mpSync();mpRender();return}
    MP.discard.push(c);MP.currentAction={card:c,seat:mySeat,started:Date.now()};mpLog('▶ P'+mySeat+' '+c.name+' · '+desc(c.name,c.type));
    const finish=()=>{if(MP.pending)resolvePending();mpRender();mpSync()};
    openCounterWindow({card:c,seat:mySeat},finish);
  }
  function mpPlaceTrap(){const p=MP.players[mySeat-1];if(MP.mode==='official'&&MP.turn!==mySeat){alert('현재 턴이 아닙니다.');return}mpChooseCardFromHand(mySeat,c=>{if(c.type!=='trap')return;const i=p.hand.indexOf(c);if(p.traps.length>=3){alert('함정은 최대 3장입니다.');return}p.hand.splice(i,1);p.traps.push(c);c.owner=mySeat;c.faceUp=false;mpLog('🪤 함정 설치: '+c.name);mpSync();mpRender()},c=>c.type==='trap')}
  function mpDrawLocal(){if(MP.mode==='official'&&MP.turn!==mySeat){alert('현재 P'+MP.turn+'의 턴입니다.');return}if(mpCheckStartWin(mySeat))return;mpDraw(mySeat,1);if(MP.mode==='official')mpNextTurn();mpSync();mpRender()}
  function mpStart(){MP.mode=document.getElementById('mm-mode').value;MP.pack=document.getElementById('mm-pack').value;mpResetState();MP.players.forEach(p=>{p.firstGame=true;mpDraw(p.seat,3);p.muffinAnnounced=false});mpLog('🧁 게임 시작 · 8인 · '+(MP.mode==='official'?'원본 턴':'자유 행동')+' · '+MP.deck.length+'장');mp3DRender();mpSync();mpRender()}

  // ----- 3D tabletop layer -----
  const muffin3D={cards:new Map(),deck:null,discard:null};
  const muffinSeatPos=[{x:0,z:4.55,rot:0},{x:3.25,z:3.15,rot:-Math.PI/4},{x:4.35,z:0,rot:-Math.PI/2},{x:3.25,z:-3.15,rot:-3*Math.PI/4},{x:0,z:-4.55,rot:Math.PI},{x:-3.25,z:-3.15,rot:3*Math.PI/4},{x:-4.35,z:0,rot:Math.PI/2},{x:-3.25,z:3.15,rot:Math.PI/4}];
  function muffinCardTex(name,type,back=false){const c=document.createElement('canvas');c.width=360;c.height=520;const x=c.getContext('2d');x.fillStyle=back?'#7c2d12':(type==='trap'?'#fce7f3':type==='counter'?'#dcfce7':'#e0f2fe');x.fillRect(0,0,c.width,c.height);x.strokeStyle=back?'#fed7aa':(type==='trap'?'#ec4899':type==='counter'?'#22c55e':'#0284c7');x.lineWidth=14;x.strokeRect(8,8,c.width-16,c.height-16);x.textAlign='center';x.textBaseline='middle';if(back){x.fillStyle='#fff7ed';x.font='900 62px sans-serif';x.fillText('MUFFIN',180,205);x.fillText('TIME',180,285);x.font='900 34px sans-serif';x.fillText('TABLETOP',180,355)}else{x.fillStyle='#0f172a';x.font='900 25px sans-serif';x.fillText(type.toUpperCase(),180,52);x.font='900 31px sans-serif';const words=String(name).split(' ');let line='',yy=165;words.forEach(w=>{if((line+' '+w).trim().length>16){x.fillText(line.trim(),180,yy);yy+=44;line=''}line+=' '+w});if(line.trim())x.fillText(line.trim(),180,yy);x.font='bold 20px sans-serif';x.fillStyle='#475569';x.fillText(desc(name,type),180,430)}return new THREE.CanvasTexture(c)}
  function createMuffin3DCard(c,x,z,rot,faceUp,local){const geo=new THREE.BoxGeometry(.86,.025,1.28),front=muffinCardTex(c.name,c.type,false),back=muffinCardTex(c.name,c.type,true),mats=[new THREE.MeshStandardMaterial({color:0xffffff}),new THREE.MeshStandardMaterial({color:0xffffff}),new THREE.MeshStandardMaterial({map:front}),new THREE.MeshStandardMaterial({map:back}),new THREE.MeshStandardMaterial({color:0xffffff}),new THREE.MeshStandardMaterial({color:0xffffff})];const m=new THREE.Mesh(geo,mats);m.position.set(x,.34,z);m.rotation.y=rot;m.rotation.z=Math.PI;m.castShadow=true;m.userData={id:'m3d_'+c.id,type:'muffin_card',muffinId:c.id,muffinType:c.type,owner:c.owner,isFlipped:!faceUp,isLocked:!local};m.material[2].visible=faceUp;m.material[3].visible=!faceUp;scene.add(m);objects.push(m);muffin3D.cards.set(c.id,m);return m}
  function clearMuffin3D(){muffin3D.cards.forEach(m=>{scene.remove(m);const i=objects.indexOf(m);if(i>=0)objects.splice(i,1)});muffin3D.cards.clear();[muffin3D.deck,muffin3D.discard].forEach(m=>{if(m){scene.remove(m);const i=objects.indexOf(m);if(i>=0)objects.splice(i,1)}});muffin3D.deck=muffin3D.discard=null}
  function createMuffinPile(type){const g=new THREE.Group();g.position.set(type==='deck'?-1.25:1.25,.34,0);g.userData={id:'muffin_'+type,type:'muffin_'+type,isLocked:false};const count=Math.min(16,type==='deck'?MP.deck.length:MP.discard.length);for(let i=0;i<count;i++){const tex=muffinCardTex('', 'action', type==='deck');const mat=[new THREE.MeshStandardMaterial({color:0xffffff}),new THREE.MeshStandardMaterial({color:0xffffff}),new THREE.MeshStandardMaterial({map:tex}),new THREE.MeshStandardMaterial({map:tex}),new THREE.MeshStandardMaterial({color:0xffffff}),new THREE.MeshStandardMaterial({color:0xffffff})];const m=new THREE.Mesh(new THREE.BoxGeometry(.86,.025,1.28),mat);m.position.y=i*.025;m.rotation.z=Math.PI;g.add(m)}scene.add(g);objects.push(g);return g}
  function mp3DRender(){clearMuffin3D();muffin3D.deck=createMuffinPile('deck');if(MP.discard.length)muffin3D.discard=createMuffinPile('discard');MP.players.forEach(p=>{const s=muffinSeatPos[p.seat-1];p.hand.forEach((c,i)=>{const spread=Math.min(.72,5.2/Math.max(1,p.hand.length)),off=(i-(p.hand.length-1)/2)*spread,dx=Math.cos(s.rot+Math.PI/2)*off,dz=Math.sin(s.rot+Math.PI/2)*off;createMuffin3DCard(c,s.x+dx,s.z+dz,s.rot,p.seat===mySeat,p.seat===mySeat)});p.traps.forEach((c,i)=>{const x=s.x+Math.cos(s.rot+Math.PI/2)*(i-1)*.95,z=s.z+Math.sin(s.rot+Math.PI/2)*(i-1)*.95;createMuffin3DCard(c,x,z,s.rot,false,p.seat===mySeat)})})}
  function muffin3DPlayAtCenter(obj){const c=MP.players[mySeat-1].hand.find(x=>x.id===obj.userData.muffinId);if(!c)return false;if(Math.hypot(obj.position.x,obj.position.z)<2){mpPlay(c.id);return true}return false}
  function muffin3DDeckTap(obj){if(obj.userData.type==='muffin_deck'){mpDrawLocal();return true}return false}

  function mpRender(){if(!MP.active)return;mp3DRender();const p=MP.players[mySeat-1];const pending=MP.pending;document.getElementById('muffin-status').innerHTML='<b>🧁 P'+mySeat+'</b> · 내 패 <b>'+p.hand.length+'</b> · 함정 <b>'+p.traps.length+'/3</b> · 덱 <b>'+MP.deck.length+'</b> · 버림 <b>'+MP.discard.length+'</b> · 목표 <b>'+MP.goal+'</b> · '+(MP.mode==='official'?'현재 P'+MP.turn+' 턴':'자유 행동')+(pending?' · <span style="color:#fbbf24">⚡ 카운터 가능</span>':'');const hand=document.getElementById('muffin-hands');hand.innerHTML='';p.hand.forEach(c=>{const d=document.createElement('button');d.className='mh-card '+c.type;d.innerHTML='<div class="badge">'+c.type.toUpperCase()+'</div><div class="ct">'+c.name+'</div><div class="ce">'+desc(c.name,c.type)+'</div>';d.onclick=()=>mpPlay(c.id);hand.appendChild(d)});const ps=document.getElementById('muffin-players');ps.innerHTML='';MP.players.forEach(q=>{const d=document.createElement('div');d.className='mp';d.innerHTML='<b>P'+q.seat+'</b> · 패 '+q.hand.length+' · 함정 '+q.traps.length+(q.seat===mySeat?' · YOU':'')+'<div class="mini">'+q.traps.map(x=>'🪤 '+x.name).join('<br>')+'</div>';ps.appendChild(d)});const box=document.getElementById('muffin-targets');if(pending){box.innerHTML='<b style="grid-column:1/-1;color:#fbbf24">⚡ '+pending.card.name+' 대응 중 — 4초</b>';const cs=p.hand.filter(x=>x.type==='counter');cs.forEach(c=>{const b=document.createElement('button');b.className='mtarget';b.style.background='#14532d';b.textContent='🟢 '+c.name;b.onclick=()=>mpPlayCounter(c.id);box.appendChild(b)})}}
  function mpOpen(){MP.active=true;document.getElementById('muffin-panel').style.display='block';document.getElementById('muffin-hud').style.display='block';document.getElementById('muffin-modal').style.display='none';if(!MP.started){mpResetState();MP.players.forEach(p=>{p.firstGame=true;mpDraw(p.seat,3);p.muffinAnnounced=false});mpLog('🧁 머핀 타임 테이블 준비 · 중앙 덱과 8인 초기 손패 3장 배치');mpSync()}mpRender()}
  function mpClose(){MP.active=false;document.getElementById('muffin-panel').style.display='none'}
  function mpHandle(data){if(data.type!=='muffin')return;if(data.op==='start'||data.op==='state'||data.op==='counter'){mpApplySnapshot(data.state);return}if(data.op==='turn'){MP.turn=data.turn;mpRender()}}
  const oldHandleNetworkData=handleNetworkData;handleNetworkData=function(data){oldHandleNetworkData(data);try{mpHandle(data)}catch(e){console.error('Muffin sync',e)}};
  document.getElementById('muffin-launch').addEventListener('click',e=>{e.stopPropagation();mpOpen()});document.getElementById('muffin-close').addEventListener('click',mpClose);document.getElementById('mm-close').addEventListener('click',()=>document.getElementById('muffin-modal').style.display='none');document.getElementById('muffin-new').addEventListener('click',()=>{document.getElementById('muffin-modal').style.display='block'});document.getElementById('muffin-hand').addEventListener('click',()=>{document.getElementById('muffin-modal').style.display='none';mpRender()});document.getElementById('muffin-draw').addEventListener('click',mpDrawLocal);document.getElementById('muffin-trap').addEventListener('click',mpPlaceTrap);document.getElementById('mm-start').addEventListener('click',mpStart);document.getElementById('mm-draw3').addEventListener('click',()=>{for(let i=0;i<3;i++)mpDraw(mySeat,1);mpSync();mpRender()});document.getElementById('mm-mode').addEventListener('change',e=>MP.mode=e.target.value);document.getElementById('mm-pack').addEventListener('change',e=>MP.pack=e.target.value);document.getElementById('mm-muffin').addEventListener('click',()=>{if(MP.players[mySeat-1].hand.length===MP.goal)MP.players[mySeat-1].muffinAnnounced=true;mpCheckMuffin(mySeat);mpSync();mpRender()});mpLog('머핀 타임 물리 테이블 엔진 준비 완료.');
})();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
